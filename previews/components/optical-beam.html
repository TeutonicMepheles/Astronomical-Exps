<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpticalBeam · 公共组件预览</title>
<style>
  :root { color-scheme: dark; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden;
    color: #f2f7ff; background:
      linear-gradient(rgb(108 158 225 / 10%) 1px, transparent 1px),
      linear-gradient(90deg, rgb(108 158 225 / 10%) 1px, transparent 1px),
      radial-gradient(circle at 50% 40%, #23487c, #0a1933 70%); background-size: 42px 42px, 42px 42px, auto; }
  main { width: min(92vw, 1180px); display: grid; grid-template-columns: 1fr 300px; gap: 28px; align-items: center; }
  .viewport { position: relative; aspect-ratio: 16 / 9; border: 1px solid rgb(151 191 255 / 22%); border-radius: 22px; overflow: hidden;
    background: rgb(4 13 29 / 56%); box-shadow: 0 28px 100px rgb(0 0 0 / 38%), inset 0 0 60px rgb(102 159 255 / 6%); }
  canvas { display: block; width: 100%; height: 100%; }
  section { padding: 26px; border: 1px solid rgb(151 191 255 / 20%); border-radius: 18px; background: rgb(7 18 39 / 76%); }
  small { color: #9ab4df; letter-spacing: .14em; }
  h1 { margin: 8px 0 16px; font-size: 28px; font-weight: 600; }
  p { margin: 0 0 20px; color: #c7d7ee; line-height: 1.7; }
  label { display: grid; gap: 8px; color: #c7d7ee; }
  input { width: 100%; accent-color: #ffc56e; }
  output { color: #ffd99d; font-variant-numeric: tabular-nums; }
  a { display: inline-block; margin-top: 22px; color: #9fc8ff; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } section { display: none; } }
</style>
</head>
<body>
<main>
  <div class="viewport" id="viewport"><canvas id="beam-preview"></canvas></div>
  <section>
    <small>SHARED / THREE.JS</small>
    <h1>OpticalBeam</h1>
    <p>公共组件只绘制宿主提供的光路线段和柔光，不计算光线。牛顿望远镜保留路径、反射、箭头、焦点与光子逻辑。</p>
    <label>透明度 <input id="opacity" type="range" min="0" max="1" step="0.01" value="0.9"><output id="opacity-value">0.90</output></label>
    <a href="./">返回组件预览目录</a>
  </section>
</main>
<script src="../../experiments/newton-telescope/vendor/three.min.js"></script>
<script src="../../shared/components/optical-beam.js"></script>
<script>
  (() => {
    const THREE = window.THREE;
    const host = document.getElementById('viewport');
    const canvas = document.getElementById('beam-preview');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setClearColor(0, 0);
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-4, 4, 2.25, -2.25, 0.1, 100);
    camera.position.z = 10;
    const rays = new THREE.Group();
    scene.add(rays);

    const guideMaterial = new THREE.LineBasicMaterial({ color: 0xffc56e, transparent: true, opacity: 0.34 });
    const guideGeometry = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-3.5, 1.1, 0),
      new THREE.Vector3(-0.4, 0, 0),
      new THREE.Vector3(3.1, 1.25, 0),
    ]);
    rays.add(new THREE.Line(guideGeometry, guideMaterial));

    const beam = new SharedComponents.OpticalBeam({ THREE, parent: rays });
    beam.addSegment([-3.5, 1.1, 0], [-0.4, 0, 0], { color: 0xffc56e });
    beam.addSegment([-3.5, -1.1, 0], [-0.4, 0, 0], { color: 0xffc56e });
    beam.addSegment([-0.4, 0, 0], [3.1, 1.25, 0], { color: 0xffc56e });
    beam.addSegment([-0.4, 0, 0], [3.1, -1.25, 0], { color: 0x9fd0ff });
    beam.setOpacity(0.9);

    const node = new THREE.Mesh(
      new THREE.CircleGeometry(0.12, 32),
      new THREE.MeshBasicMaterial({ color: 0xfff0bd }),
    );
    node.position.set(-0.4, 0, 0.02);
    rays.add(node);

    function resize() {
      const width = host.clientWidth;
      const height = host.clientHeight;
      const dpr = Math.min(devicePixelRatio || 1, 2);
      renderer.setPixelRatio(dpr);
      renderer.setSize(width, height, false);
      renderer.render(scene, camera);
    }
    new ResizeObserver(resize).observe(host);
    resize();

    const input = document.getElementById('opacity');
    const output = document.getElementById('opacity-value');
    input.addEventListener('input', () => {
      const value = Number(input.value);
      beam.setOpacity(value);
      output.value = value.toFixed(2);
      renderer.render(scene, camera);
    });
  })();
</script>
</body>
</html>
