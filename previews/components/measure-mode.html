<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeasureMode · 公共组件预览</title>
<link rel="stylesheet" href="../../shared/components/measure-mode/measure-mode.css">
<link rel="stylesheet" href="../../shared/components/measure-mode/skins/blueprint.css">
<link rel="stylesheet" href="../../shared/components/measure-mode/skins/ink.css">
<link rel="stylesheet" href="../../shared/components/measure-mode/skins/hud.css">
<link rel="stylesheet" href="../../shared/components/measure-mode/skins/soft.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f15;
    font: 14px/1.5 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px;
    transform-origin: 50% 50%; overflow: hidden; }
  #scene { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; }
  .scene[hidden] { display: none; }
  .scene > svg { display: block; width: 100%; height: 100%; }

  /* Review chrome only: not part of the component. */
  .review-bar { position: absolute; left: 20px; bottom: 20px; z-index: 30;
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px;
    background: rgb(10 14 20 / 78%); border: 1px solid rgb(255 255 255 / 12%);
    color: #cdd8e4; font-size: 13px; backdrop-filter: blur(8px); }
  .review-bar span { opacity: .55; }
  .review-bar button { padding: 4px 10px; border-radius: 7px; cursor: pointer;
    color: #d6e2ee; background: rgb(255 255 255 / 7%); border: 1px solid rgb(255 255 255 / 14%);
    font: inherit; }
  .review-bar button[aria-pressed="true"] { color: #fff; background: #2f6f8f; border-color: #4f93b5; }
  .review-bar button:focus-visible { outline: 2px solid #8ec6e6; outline-offset: 2px; }
  .review-bar .sep { width: 1px; height: 18px; background: rgb(255 255 255 / 16%); }
</style>
</head>
<body class="style-blueprint">
<div id="stage">
  <div id="scene">

    <!-- 工程制图 -->

  </div>

  <div class="review-bar">
    <span>风格</span>
    <button type="button" data-skin="blueprint" aria-pressed="true">工程制图</button>
    <button type="button" data-skin="ink" aria-pressed="false">手绘批注</button>
    <button type="button" data-skin="hud" aria-pressed="false">观测仪器</button>
    <button type="button" data-skin="soft" aria-pressed="false">柔光现代</button>
    <i class="sep"></i>
    <span>线形</span>
    <button type="button" data-shape="straight" aria-pressed="true">直线</button>
    <button type="button" data-shape="arc" aria-pressed="false">弧线</button>
  </div>
</div>

<script src="../../shared/components/measure-mode/measure-mode.js"></script>
<script>
(function () {
  'use strict';
  var stage = document.getElementById('stage');
  var scene = document.getElementById('scene');

  function fit() {
    var s = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  fit();
  window.addEventListener('resize', fit);

  // One instance, one unit, four skins: the point of the preview is that the
  // visual language changes and the interaction script does not.
  var mw = SharedComponents.MeasureMode(scene, { label: '距离', unit: 'm', pxPerUnit: 4, decimal: 1 });
  window.__measurePreview = mw;

  function selectSkin(name) {
    document.body.className = 'style-' + name;
    document.querySelectorAll('.scene').forEach(function (el) {
      el.hidden = el.dataset.scene !== name;
    });
    document.querySelectorAll('[data-skin]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.skin === name));
    });
  }

  document.querySelectorAll('[data-skin]').forEach(function (b) {
    b.addEventListener('click', function () { selectSkin(b.dataset.skin); });
  });
  document.querySelectorAll('[data-shape]').forEach(function (b) {
    b.addEventListener('click', function () {
      mw.setShape(b.dataset.shape);
      document.querySelectorAll('[data-shape]').forEach(function (o) {
        o.setAttribute('aria-pressed', String(o === b));
      });
    });
  });
})();
</script>
</body>
</html>
