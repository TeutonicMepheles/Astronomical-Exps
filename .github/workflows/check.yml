name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run export -- newton-telescope
      - run: npm run export -- light-pollution
      - run: npm run test:browser
      - name: Changed scope (maintainer review report)
        if: github.event_name == 'pull_request'
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          REVIEW_BRANCH: ${{ github.head_ref }}
        run: python tools/check_scope.py --base "$REVIEW_BASE" --branch "$REVIEW_BRANCH"
