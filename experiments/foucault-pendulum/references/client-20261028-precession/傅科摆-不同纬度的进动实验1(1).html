<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>傅科摆偏转周期演示</title>
<style>
  :root{
    --bg:#070b14;
    --panel:#101827;
    --line:#1e2c44;
    --text:#dce8f7;
    --muted:#7f95b3;
    --accent:#4fc3f7;
    --accent2:#ffb74d;
    --good:#5ee7a0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(ellipse at 50% -10%, #13253f 0%, #070b14 55%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
    padding:18px;
  }
  header{
    max-width:1220px;
    margin:0 auto 16px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:22px;
    font-weight:600;
    letter-spacing:1px;
    background:linear-gradient(90deg,#7fd4ff,#b3a4ff,#ffd180);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{
    margin:0;
    font-size:12.5px;
    color:var(--muted);
  }
  .wrap{
    max-width:1220px;
    margin:0 auto;
    display:grid;
    grid-template-columns:430px 1fr;
    gap:16px;
    align-items:start;
  }
  @media (max-width:980px){
    .wrap{grid-template-columns:1fr;}
  }
  .panel{
    background:linear-gradient(180deg,#101827 0%,#0b1220 100%);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  .panel h2{
    margin:0 0 12px;
    font-size:14px;
    font-weight:600;
    color:var(--accent);
    letter-spacing:.5px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel h2::before{
    content:"";
    width:4px;height:14px;border-radius:2px;
    background:linear-gradient(180deg,var(--accent),#8a7dff);
  }
  canvas{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:12px;}
  #pendCanvas{background:radial-gradient(ellipse at 50% 20%,#16233a 0%,#0a1120 70%);}
  #earthCanvas{background:radial-gradient(circle at 50% 45%,#0d1930 0%,#060a13 75%);cursor:grab;}
  #earthCanvas:active{cursor:grabbing;}

  .controls{
    margin-top:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .row label{
    font-size:12.5px;
    color:var(--muted);
    min-width:64px;
  }
  select,input[type=number]{
    background:#0a1424;
    color:var(--text);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 9px;
    font-size:13px;
    outline:none;
    font-family:inherit;
  }
  select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,195,247,.15);}
  input[type=number]{width:92px;}
  button{
    background:linear-gradient(180deg,#1d3c5e,#14283f);
    color:var(--text);
    border:1px solid #2b4d74;
    border-radius:8px;
    padding:6px 14px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
    transition:.15s;
  }
  button:hover{background:linear-gradient(180deg,#27537f,#1a3450);border-color:var(--accent);}
  button:active{transform:scale(.97);}
  .chip{
    padding:4px 10px;
    font-size:12px;
    border-radius:999px;
    background:#0d1a2c;
    border:1px solid #22364f;
    color:#9fc0e0;
  }
  .chip:hover{border-color:var(--accent);color:#fff;}

  .readout{
    margin-top:12px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .stat{
    background:#0a1424;
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 11px;
  }
  .stat .k{font-size:11px;color:var(--muted);margin-bottom:3px;}
  .stat .v{font-size:15px;font-weight:600;color:var(--accent2);font-variant-numeric:tabular-nums;}
  .stat .v.small{font-size:13px;}
  .stat.wide{grid-column:1 / -1;}
  .stat .v.accent{color:var(--good);}

  .hint{
    font-size:11.5px;
    color:var(--muted);
    margin-top:10px;
    line-height:1.6;
  }
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:middle;}
</style>
</head>
<body>

<header>
  <h1>傅科摆 · 地球不同纬度的偏转周期</h1>
  <p>拖拽地球可旋转视角 · 点击地点标记或输入纬度 · 观察摆动平面的进动</p>
</header>

<div class="wrap">

  <!-- ============ 左侧：傅科摆模型 ============ -->
  <section class="panel">
    <h2>傅科摆模型</h2>
    <canvas id="pendCanvas"></canvas>

    <div class="controls">
      <div class="row">
        <label>摆线长度</label>
        <select id="lenSel">
          <option value="28">28 米（短）</option>
          <option value="67" selected>67 米（中）</option>
          <option value="100">100 米（长）</option>
        </select>
      </div>
      <div class="row">
        <label>摆锤重量</label>
        <select id="wtSel">
          <option value="25">25 kg</option>
          <option value="28" selected>28 kg</option>
          <option value="50">50 kg</option>
        </select>
      </div>
    </div>

    <div class="readout">
      <div class="stat">
        <div class="k">摆动周期 T = 2π√(L/g)</div>
        <div class="v" id="swingPeriodOut">—</div>
      </div>
      <div class="stat">
        <div class="k">摆锤质量</div>
        <div class="v small" id="weightOut">—</div>
      </div>
    </div>

    <div class="hint">
      <span class="dot"></span>摆锤质量不影响摆动周期，只影响模型外观（摆锤大小）。
    </div>
  </section>

  <!-- ============ 右侧：地球 ============ -->
  <section class="panel">
    <h2>地球 · 选择观测地点</h2>
    <canvas id="earthCanvas"></canvas>

    <div class="controls">
      <div class="row">
        <label>输入纬度</label>
        <input id="latInput" type="number" min="-90" max="90" step="0.1" value="31.23">
        <button id="applyBtn">定位</button>
        <span style="font-size:11.5px;color:var(--muted)">北纬为正，南纬为负</span>
      </div>
      <div class="row" id="quickRow">
        <label>快捷地点</label>
        <button class="chip" data-loc="0">上海</button>
        <button class="chip" data-loc="1">巴黎</button>
        <button class="chip" data-loc="2">新加坡</button>
        <button class="chip" data-loc="3">悉尼</button>
        <button class="chip" data-loc="4">南极</button>
        <button class="chip" data-loc="5">北极</button>
      </div>
    </div>

    <div class="readout">
      <div class="stat">
        <div class="k">当前地点</div>
        <div class="v small accent" id="locOut">—</div>
      </div>
      <div class="stat">
        <div class="k">地理纬度</div>
        <div class="v small" id="latOut">—</div>
      </div>
      <div class="stat">
        <div class="k">傅科摆偏转周期（摆动平面转一圈）</div>
        <div class="v" id="precOut">—</div>
      </div>
      <div class="stat">
        <div class="k">每小时偏转角 / 方向</div>
        <div class="v small" id="rateOut">—</div>
      </div>
    </div>

    <div class="hint">
      <span class="dot"></span>偏转周期 T = 24 h ÷ |sin φ|。赤道上不偏转（周期无限大），两极处 24 小时转一整圈。
    </div>
  </section>

</div>

<script>
"use strict";

/* =========================================================
   常量与状态
   ========================================================= */
const DEG = Math.PI / 180;
const TAU = Math.PI * 2;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const G = 9.81;

const LOCATIONS = [
  { name: '上海',   lat:  31.23, lon: 121.47 },
  { name: '巴黎',   lat:  48.86, lon:   2.35 },
  { name: '新加坡', lat:   1.35, lon: 103.82 },
  { name: '悉尼',   lat: -33.87, lon: 151.21 },
  { name: '南极',   lat: -90,    lon:   0    },
  { name: '北极',   lat:  90,    lon:   0    }
];

const state = {
  lat: 31.23,
  lon: 121.47,
  name: '上海',
  length: 67,     // m
  weight: 28,     // kg
  rotLon: 0,
  tilt: 15
};

/* =========================================================
   画布初始化
   ========================================================= */
function setupCanvas(canvas, w, h){
  canvas.width  = Math.round(w * DPR);
  canvas.height = Math.round(h * DPR);
  canvas.style.width = w + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);
  return ctx;
}

/* ---------- 左侧摆模型 ---------- */
const P = { W: 420, H: 520 };
const pendCanvas = document.getElementById('pendCanvas');
const pendCtx = setupCanvas(pendCanvas, P.W, P.H);

/* ---------- 右侧地球 ---------- */
const E = { W: 560, H: 560, cx: 250, cy: 282, R: 203 };
const earthCanvas = document.getElementById('earthCanvas');
const earthCtx = setupCanvas(earthCanvas, E.W, E.H);

// 底图缓存（经纬网 + 标签）
const baseCanvas = document.createElement('canvas');
baseCanvas.width  = Math.round(E.W * DPR);
baseCanvas.height = Math.round(E.H * DPR);
const baseCtx = baseCanvas.getContext('2d');
baseCtx.scale(DPR, DPR);

/* =========================================================
   投影：球面 → 屏幕
   ========================================================= */
function project(lat, lon){
  const phi = lat * DEG;
  const lam = (lon - state.rotLon) * DEG;
  const t   = state.tilt * DEG;

  const cp = Math.cos(phi), sp = Math.sin(phi);
  const x0 = cp * Math.cos(lam);   // 屏幕右方向
  const y0 = cp * Math.sin(lam);   // 朝向观察者
  const z0 = sp;                   // 北方向

  return {
    x: E.cx + E.R * x0,
    y: E.cy + E.R * (y0 * Math.sin(t) - z0 * Math.cos(t)),
    d: y0 * Math.cos(t) + z0 * Math.sin(t)   // >0 表示朝向观察者
  };
}

/* =========================================================
   物理
   ========================================================= */
function swingPeriod(L){ return TAU * Math.sqrt(L / G); }

function precessionHours(lat){
  const s = Math.abs(Math.sin(lat * DEG));
  if (s < 1e-4) return Infinity;
  return 24 / s;
}

/* =========================================================
   工具
   ========================================================= */
function fmtLat(lat){
  const a = Math.abs(lat);
  const v = (Math.abs(a - Math.round(a)) < 0.005) ? Math.round(a).toString() : a.toFixed(2);
  if (Math.abs(lat) < 0.005) return '0° （赤道）';
  return v + '° ' + (lat > 0 ? 'N 北纬' : 'S 南纬');
}

function fmtPeriod(hours){
  if (!isFinite(hours)) return '∞（不偏转）';
  if (hours >= 72){
    const d = hours / 24;
    return d.toFixed(1) + ' 天';
  }
  let h = Math.floor(hours);
  let m = Math.round((hours - h) * 60);
  if (m === 60){ m = 0; h += 1; }
  return h + ' 小时 ' + m + ' 分';
}

function strokeProjected(ctx, pts, color, width){
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  let pen = false;
  for (let i = 0; i < pts.length; i++){
    const p = pts[i];
    if (p.d > 0){
      if (pen) ctx.lineTo(p.x, p.y);
      else { ctx.moveTo(p.x, p.y); pen = true; }
    } else {
      pen = false;
    }
  }
  ctx.stroke();
}

/* =========================================================
   绘制地球底图（缓存）
   ========================================================= */
function rebuildBase(){
  const ctx = baseCtx;
  ctx.clearRect(0, 0, E.W, E.H);

  /* 大气光晕 */
  const glow = ctx.createRadialGradient(E.cx, E.cy, E.R * 0.88, E.cx, E.cy, E.R * 1.16);
  glow.addColorStop(0, 'rgba(80,170,255,0.22)');
  glow.addColorStop(1, 'rgba(80,170,255,0)');
  ctx.beginPath();
  ctx.arc(E.cx, E.cy, E.R * 1.16, 0, TAU);
  ctx.fillStyle = glow;
  ctx.fill();

  /* 球体 */
  const g = ctx.createRadialGradient(
    E.cx - E.R * 0.38, E.cy - E.R * 0.42, E.R * 0.05,
    E.cx, E.cy, E.R * 1.02
  );
  g.addColorStop(0,   '#4a9fd0');
  g.addColorStop(0.45,'#1a6398');
  g.addColorStop(1,   '#05253d');
  ctx.beginPath();
  ctx.arc(E.cx, E.cy, E.R, 0, TAU);
  ctx.fillStyle = g;
  ctx.fill();

  /* 裁剪到球内 */
  ctx.save();
  ctx.beginPath();
  ctx.arc(E.cx, E.cy, E.R, 0, TAU);
  ctx.clip();

  /* 经线：每 30° */
  for (let lon = 0; lon < 360; lon += 30){
    const pts = [];
    for (let lat = -90; lat <= 90; lat += 2) pts.push(project(lat, lon));
    strokeProjected(ctx, pts, 'rgba(150,215,255,0.16)', 0.8);
  }

  /* 纬线：每 5° */
  for (let lat = -85; lat <= 85; lat += 5){
    const pts = [];
    for (let lon = 0; lon <= 360; lon += 2) pts.push(project(lat, lon));
    if (lat === 0){
      strokeProjected(ctx, pts, 'rgba(255,214,120,0.85)', 1.5);
    } else {
      strokeProjected(ctx, pts, 'rgba(150,215,255,0.38)', 0.9);
    }
  }

  ctx.restore();

  /* 球体轮廓 */
  ctx.beginPath();
  ctx.arc(E.cx, E.cy, E.R, 0, TAU);
  ctx.strokeStyle = 'rgba(130,205,255,0.65)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  /* ---- 纬度标注 ---- */
  const labels = [];
  for (let lat = -85; lat <= 85; lat += 5){
    // 在可见弧上取屏幕 x 最大的点
    let best = null;
    for (let lon = 0; lon < 360; lon += 2){
      const p = project(lat, lon);
      if (p.d > 0.02 && (!best || p.x > best.x)) best = p;
    }
    const yBase = E.cy + E.R * Math.sin(lat * DEG) * Math.cos(state.tilt * DEG);
    labels.push({ lat, y: yBase });
  }

  // 防重叠
  labels.sort((a, b) => a.y - b.y);
  let lastY = -Infinity;
  for (const l of labels){
    if (l.y < lastY + 10.5) l.y = lastY + 10.5;
    lastY = l.y;
  }

  ctx.font = '9px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  for (const l of labels){
    const x = E.cx + E.R + 9;
    const isEq = (l.lat === 0);
    const txt = isEq ? '0°' : (Math.abs(l.lat) + '°' + (l.lat > 0 ? 'N' : 'S'));

    // 引线
    ctx.beginPath();
    ctx.moveTo(E.cx + E.R * Math.cos(Math.asin(Math.max(-1, Math.min(1,(l.y - E.cy)/E.R)))) * 0.0 + E.cx + 0, l.y);
    ctx.strokeStyle = 'transparent';
    ctx.stroke();

    ctx.fillStyle = isEq ? 'rgba(255,214,120,0.95)' : 'rgba(168,212,246,0.72)';
    ctx.fillText(txt, x, l.y);
  }
}

/* =========================================================
   绘制地球（每帧）
   ========================================================= */
function drawEarth(phase){
  const ctx = earthCtx;
  ctx.clearRect(0, 0, E.W, E.H);

  // 底图
  ctx.drawImage(baseCanvas, 0, 0, E.W, E.H);

  /* ---- 地点标记 ---- */
  for (const loc of LOCATIONS){
    const p = project(loc.lat, loc.lon);
    if (p.d <= 0.02) continue;

    const isSel = (state.name === loc.name) && (Math.abs(state.lat - loc.lat) < 0.01);

    // 光点
    const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 12);
    gg.addColorStop(0, isSel ? 'rgba(255,183,77,0.95)' : 'rgba(94,231,160,0.85)');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(p.x, p.y, 12, 0, TAU);
    ctx.fillStyle = gg;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(p.x, p.y, isSel ? 4.5 : 3.2, 0, TAU);
    ctx.fillStyle = isSel ? '#ffd180' : '#7ff0b8';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 名称
    ctx.font = '10px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillText(loc.name, p.x + 11, p.y + 1);
    ctx.fillStyle = isSel ? '#ffd180' : 'rgba(210,235,255,0.92)';
    ctx.fillText(loc.name, p.x + 10, p.y);
  }

  /* ---- 选中地点：小傅科摆 ---- */
  const sp = project(state.lat, state.lon);
  if (sp.d > 0.02){
    const pivotX = sp.x;
    const pivotY = sp.y - 46;
    const sway = Math.sin(phase * 1.6) * 7;

    // 支架
    ctx.beginPath();
    ctx.moveTo(pivotX, pivotY);
    ctx.lineTo(pivotX, pivotY - 8);
    ctx.strokeStyle = 'rgba(180,225,255,0.9)';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // 摆动平面（水平椭圆）
    ctx.beginPath();
    ctx.ellipse(pivotX, sp.y, 15, 4.5, 0, 0, TAU);
    ctx.strokeStyle = 'rgba(255,183,77,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 摆线
    ctx.beginPath();
    ctx.moveTo(pivotX, pivotY);
    ctx.lineTo(pivotX + sway, sp.y - 1);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // 摆锤
    ctx.beginPath();
    ctx.arc(pivotX + sway, sp.y - 1, 3.6, 0, TAU);
    const bg = ctx.createRadialGradient(
      pivotX + sway - 1.2, sp.y - 2.2, 0.4,
      pivotX + sway, sp.y - 1, 4
    );
    bg.addColorStop(0, '#fff3d0');
    bg.addColorStop(1, '#d99b2b');
    ctx.fillStyle = bg;
    ctx.fill();
  }
}

/* =========================================================
   绘制左侧傅科摆模型
   ========================================================= */
function lengthToPixels(L){
  return 160 * Math.sqrt(L / 28);
}

function drawDial(ctx, cx, cy, rx, ry){
  // 盘面
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU);
  const dg = ctx.createLinearGradient(cx, cy - ry, cx, cy + ry);
  dg.addColorStop(0, 'rgba(26,50,84,0.92)');
  dg.addColorStop(1, 'rgba(10,20,36,0.92)');
  ctx.fillStyle = dg;
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,190,255,0.55)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 内圈
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx * 0.93, ry * 0.93, 0, 0, TAU);
  ctx.strokeStyle = 'rgba(120,190,255,0.18)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 刻度（每 10°）
  for (let a = 0; a < 360; a += 10){
    const rad = a * DEG;
    const ca = Math.cos(rad), sa = Math.sin(rad);
    const major = (a % 90 === 0);
    const mid   = (a % 30 === 0);
    const inner = major ? 0.88 : (mid ? 0.92 : 0.955);

    ctx.beginPath();
    ctx.moveTo(cx + rx * ca, cy + ry * sa);
    ctx.lineTo(cx + rx * inner * ca, cy + ry * inner * sa);
    ctx.strokeStyle = major
      ? 'rgba(255,220,130,0.95)'
      : (mid ? 'rgba(150,210,255,0.6)' : 'rgba(130,190,255,0.3)');
    ctx.lineWidth = major ? 2 : 1;
    ctx.stroke();
  }

  // 角度数字（每 30°）
  ctx.font = '9px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let a = 0; a < 360; a += 30){
    const rad = a * DEG;
    const x = cx + rx * 0.79 * Math.cos(rad);
    const y = cy + ry * 0.79 * Math.sin(rad);
    ctx.fillStyle = 'rgba(170,215,255,0.8)';
    ctx.fillText(a + '°', x, y);
  }

  // 中心标记
  ctx.beginPath();
  ctx.arc(cx, cy, 2.2, 0, TAU);
  ctx.fillStyle = 'rgba(140,200,255,0.5)';
  ctx.fill();
}

function drawPendulum(phase, beta){
  const ctx = pendCtx;
  ctx.clearRect(0, 0, P.W, P.H);

  const Lpix   = lengthToPixels(state.length);
  const pivotX = P.W / 2;
  const pivotY = 70;
  const dialCy = pivotY + Lpix;
  const dialRX = 140;
  const dialRY = 49;

  /* 顶部支架 */
  ctx.beginPath();
  ctx.moveTo(pivotX - 46, pivotY - 26);
  ctx.lineTo(pivotX + 46, pivotY - 26);
  ctx.lineTo(pivotX + 10, pivotY);
  ctx.lineTo(pivotX - 10, pivotY);
  ctx.closePath();
  ctx.fillStyle = 'rgba(120,170,220,0.28)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(140,200,255,0.6)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  /* 悬挂点 */
  ctx.beginPath();
  ctx.arc(pivotX, pivotY, 3.6, 0, TAU);
  ctx.fillStyle = '#cfe9ff';
  ctx.fill();

  /* 圆盘 */
  drawDial(ctx, pivotX, dialCy, dialRX, dialRY);

  /* 摆动平面方向线 */
  const dirX = Math.cos(beta), dirY = Math.sin(beta);
  ctx.beginPath();
  ctx.moveTo(pivotX - dialRX * 0.9 * dirX, dialCy - dialRY * 0.9 * dirY);
  ctx.lineTo(pivotX + dialRX * 0.9 * dirX, dialCy + dialRY * 0.9 * dirY);
  ctx.strokeStyle = 'rgba(255,183,77,0.28)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 摆锤位置 */
  const A  = 0.18 * Lpix;
  const u  = A * Math.sin(phase);
  const ux = u * Math.cos(beta);
  const uy = u * Math.sin(beta) * 0.35;

  const bobX = pivotX + ux;
  const bobY = dialCy + uy;

  /* 摆线 */
  ctx.beginPath();
  ctx.moveTo(pivotX, pivotY);
  ctx.lineTo(bobX, bobY);
  const lg = ctx.createLinearGradient(pivotX, pivotY, bobX, bobY);
  lg.addColorStop(0, 'rgba(200,230,255,0.9)');
  lg.addColorStop(1, 'rgba(140,190,240,0.75)');
  ctx.strokeStyle = lg;
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 摆锤大小随重量变化 */
  const r = 10 + (state.weight - 25) * 0.35;

  // 阴影
  ctx.beginPath();
  ctx.ellipse(bobX, dialCy + dialRY * 0.62, r * 0.9, r * 0.32, 0, 0, TAU);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fill();

  // 球体
  const bg = ctx.createRadialGradient(bobX - r * 0.35, bobY - r * 0.4, r * 0.1, bobX, bobY, r);
  bg.addColorStop(0, '#fff6dd');
  bg.addColorStop(0.4, '#f5c05a');
  bg.addColorStop(1, '#9a6208');
  ctx.beginPath();
  ctx.arc(bobX, bobY, r, 0, TAU);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,240,200,0.55)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 高光
  ctx.beginPath();
  ctx.arc(bobX - r * 0.32, bobY - r * 0.38, r * 0.22, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fill();

  /* 当前摆长文字 */
  ctx.font = '11px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(150,195,235,0.7)';
  const lv = state.length === 28 ? '短' : (state.length === 67 ? '中' : '长');
  ctx.fillText('摆线 ' + state.length + ' m（' + lv + '）', P.W / 2, dialCy + dialRY + 30);
}

/* =========================================================
   交互
   ========================================================= */
function getLogicalPos(canvas, evt, logicalW){
  const r = canvas.getBoundingClientRect();
  const k = logicalW / r.width;
  return {
    x: (evt.clientX - r.left) * k,
    y: (evt.clientY - r.top)  * k
  };
}

let dragging = false;
let moved = false;
let dragStart = null;

earthCanvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  moved = false;
  dragStart = {
    x: e.clientX,
    y: e.clientY,
    rotLon: state.rotLon,
    tilt: state.tilt
  };
  earthCanvas.setPointerCapture(e.pointerId);
});

earthCanvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;

  if (!moved && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) moved = true;

  if (moved){
    state.rotLon = dragStart.rotLon - dx * 0.55;
    state.tilt   = Math.max(-85, Math.min(85, dragStart.tilt + dy * 0.35));
    rebuildBase();
  }
});

earthCanvas.addEventListener('pointerup', (e) => {
  if (!dragging) return;
  dragging = false;

  if (!moved){
    const pos = getLogicalPos(earthCanvas, e, E.W);
    let hit = null;
    for (const loc of LOCATIONS){
      const p = project(loc.lat, loc.lon);
      if (p.d > 0.02 && Math.hypot(p.x - pos.x, p.y - pos.y) < 20){
        hit = loc;
        break;
      }
    }
    if (hit) selectLocation(hit);
  }
});

earthCanvas.addEventListener('pointercancel', () => { dragging = false; });

/* =========================================================
   选择地点 / 更新读数
   ========================================================= */
function ensureVisible(){
  for (let i = 0; i < 3; i++){
    const p = project(state.lat, state.lon);
    if (p.d > 0.12) return;
    const mag = Math.max(22, Math.abs(state.lat) * 0.62);
    state.tilt = state.lat >= 0 ? mag : -mag;
    state.tilt = Math.max(-78, Math.min(78, state.tilt));
  }
  // 仍然不可见 → 把经度转到正对镜头的方向
  state.rotLon = state.lon - 90;
  rebuildBase();
}

function selectLocation(loc){
  state.lat = loc.lat;
  state.lon = loc.lon;
  state.name = loc.name;
  ensureVisible();
  rebuildBase();
  updateReadout();
}

function setLatitude(lat){
  lat = Math.max(-90, Math.min(90, lat));
  state.lat = lat;
  state.lon = state.rotLon + 90;   // 正对观察者
  state.name = '自定义位置';
  ensureVisible();
  rebuildBase();
  updateReadout();
}

function updateReadout(){
  /* --- 左侧 --- */
  const T = swingPeriod(state.length);
  document.getElementById('swingPeriodOut').textContent = T.toFixed(2) + ' 秒';
  document.getElementById('weightOut').textContent =
      state.weight + ' kg' + (state.weight >= 50 ? '（重锤）' : '');

  /* --- 右侧 --- */
  const sinLat = Math.abs(Math.sin(state.lat * DEG));
  const Tprec  = precessionHours(state.lat);

  document.getElementById('locOut').textContent = state.name;
  document.getElementById('latOut').textContent = fmtLat(state.lat);
  document.getElementById('precOut').textContent = fmtPeriod(Tprec);

  if (sinLat < 1e-4){
    document.getElementById('rateOut').textContent = '0°/小时 （不偏转）';
  } else {
    const rate = (15 * sinLat).toFixed(2);
    const dir  = state.lat > 0 ? '顺时针' : '逆时针';
    document.getElementById('rateOut').textContent = rate + '°/小时 · ' + dir;
  }
}

/* =========================================================
   控件绑定
   ========================================================= */
document.getElementById('lenSel').addEventListener('change', (e) => {
  state.length = parseFloat(e.target.value);
  updateReadout();
});

document.getElementById('wtSel').addEventListener('change', (e) => {
  state.weight = parseFloat(e.target.value);
  updateReadout();
});

document.getElementById('applyBtn').addEventListener('click', () => {
  const v = parseFloat(document.getElementById('latInput').value);
  if (isFinite(v)) setLatitude(v);
});

document.getElementById('latInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter'){
    const v = parseFloat(e.target.value);
    if (isFinite(v)) setLatitude(v);
  }
});

document.getElementById('quickRow').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-loc]');
  if (!btn) return;
  const loc = LOCATIONS[parseInt(btn.dataset.loc, 10)];
  if (loc){
    document.getElementById('latInput').value = loc.lat;
    selectLocation(loc);
  }
});

/* =========================================================
   主循环
   ========================================================= */
let phase = 0;
let beta  = 0;
let lastTs = performance.now();

function animate(ts){
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 0.06);

  /* 摆动相位：真实周期 */
  const T = swingPeriod(state.length);
  phase += (TAU / T) * dt;

  /* 摆动平面进动：动画加速（1 真实小时 ≈ 0.5 秒） */
  const TprecH = precessionHours(state.lat);
  if (isFinite(TprecH)){
    let omega = TAU / (TprecH * 0.5);
    if (state.lat < 0) omega = -omega;
    beta += omega * dt;
  }

  drawPendulum(phase, beta);
  drawEarth(phase);

  requestAnimationFrame(animate);
}

/* =========================================================
   启动
   ========================================================= */
rebuildBase();
updateReadout();
requestAnimationFrame(animate);

/* 窗口尺寸变化时，重建底图（因为标签位置依赖逻辑坐标，无需重建，
   但保持调用可确保清晰度） */
window.addEventListener('resize', () => { /* 保持逻辑坐标，无需处理 */ });
</script>
