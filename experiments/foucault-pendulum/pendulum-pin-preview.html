<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>傅科摆 · 球面摆架方案</title>
<link rel="stylesheet" href="../../shared/typography/typography.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: grid; place-items: center; background: #080f1a; color: #eff6ff; font-family: var(--font-sans, system-ui), sans-serif; }
  main { width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; container-type: inline-size; padding: 3% 3.4%; background: radial-gradient(ellipse at top, #172c43, #0b1523 74%); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1em; }
  h1 { margin: 0; font-size: 2.5cqw; font-weight: 500; }
  header p { color: #a8bed3; font-size: 1.15cqw; }
  nav { display: flex; gap: .6cqw; margin: 1.4cqw 0 1.6cqw; }
  button { font: inherit; font-size: 1.25cqw; color: inherit; background: #192b40; border: 1px solid #39516b; border-radius: .6cqw; padding: .65cqw .95cqw; cursor: pointer; }
  button[aria-pressed="true"] { color: #071823; background: #86e5e8; border-color: #86e5e8; }
  #reset { margin-left: auto; }
  section { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.2cqw; }
  article { border: 1px solid #344b66; border-radius: 1cqw; overflow: hidden; background: #101e30; }
  canvas { display: block; width: 100%; touch-action: none; cursor: grab; background: radial-gradient(ellipse, #233d58, #101e30 72%); }
  canvas:active { cursor: grabbing; }
  .caption { padding: 1cqw 1.35cqw 1.3cqw; border-top: 1px solid #344b66; }
  h2 { margin: 0 0 .35cqw; font-size: 1.65cqw; color: var(--accent); }
  .caption p, footer { margin: 0; color: #b7c9dc; font-size: 1.17cqw; }
  footer { margin-top: 1.2cqw; }
</style>
<main>
  <header><h1>傅科摆 · 球面摆架方案</h1><p>选地点，或拖动任一地球同步换视角</p></header>
  <nav aria-label="观察地点"><button id="reset" type="button">回到地点视角</button></nav>
  <section aria-label="三个摆架方案">
    <article style="--accent:#80eced"><canvas width="540" height="510" aria-label="单臂图钉三维预览"></canvas><div class="caption"><h2>A · 单臂图钉</h2><p>一个锚点，悬臂将摆锤让到外侧。</p></div></article>
    <article style="--accent:#ffcd82"><canvas width="540" height="510" aria-label="双脚门架三维预览"></canvas><div class="caption"><h2>B · 双脚门架</h2><p>两脚贴地，摆锤在框架中央往返。</p></div></article>
    <article style="--accent:#c6b5ff"><canvas width="540" height="510" aria-label="拱形观测架三维预览"></canvas><div class="caption"><h2>C · 拱形观测架</h2><p>弧形支架与底环围出一块观测区。</p></div></article>
  </section>
  <footer>摆锤沿半透明摆平面往返，底部留痕随摆平面偏转逐渐形成花瓣。偏转已加速演示。</footer>
</main>
<script type="module">

  const locations = [
    ['上海', 31.23, 121.47], ['巴黎', 48.86, 2.35], ['新加坡', 1.35, 103.82],
    ['悉尼', -33.87, 151.21], ['南极', -90, 0], ['北极', 90, 0],
  ];
  const radians = Math.PI / 180;
  const tau = Math.PI * 2;
  const radius = 153;
  const globeSize = radius * 2;
  const center = [250, 273];
  const canvases = [...document.querySelectorAll('canvas')];
  const contexts = canvases.map(canvas => canvas.getContext('2d'));
  const globe = Object.assign(document.createElement('canvas'), { width: globeSize, height: globeSize });
  const globeContext = globe.getContext('2d');
  const globePixels = globeContext.createImageData(globeSize, globeSize);
  let texture;
  let selected = 0;
  let pitch;
  let yaw;
  let globeDirty = true;
  let drag;
  let frame = 0;
  let previousFrame;
  let elapsed = 0;
  let heading = 0;
  const trail = [];
  let lastTrailSample = -Infinity;
  const reset = document.querySelector('#reset');
  const buttons = locations.map(([name], index) => {
    const button = document.createElement('button');
    button.textContent = name;
    button.addEventListener('click', () => select(index));
    reset.before(button);
    return button;
  });
  function select(index) {
    selected = index;
    heading = 0;
    elapsed = 0;
    trail.length = 0;
    lastTrailSample = -Infinity;
    buttons.forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
    resetView();
  }
  function resetView() {
    const [, latitude, longitude] = locations[selected];
    pitch = Math.max(-58, Math.min(58, latitude - 14)) * radians;
    yaw = (longitude - 49) * radians;
    globeDirty = true;
  }
  reset.addEventListener('click', resetView);
  select(0);

  const image = new Image();
  image.onload = () => {
    const map = Object.assign(document.createElement('canvas'), {width: image.width, height: image.height});
    const context = map.getContext('2d');
    context.drawImage(image, 0, 0);
    texture = context.getImageData(0, 0, map.width, map.height);
    globeDirty = true;
  };
  image.src = './assets/earth-eq-redraw-1152x576.png';

  function basis(latitude, longitude) {
    const sinLat = Math.sin(latitude);
    const cosLat = Math.cos(latitude);
    const sinLon = Math.sin(longitude);
    const cosLon = Math.cos(longitude);
    return [
      [cosLon, 0, -sinLon],
      [-sinLat * sinLon, cosLat, -sinLat * cosLon],
      [cosLat * sinLon, sinLat, cosLat * cosLon],
    ];
  }
  function combine(axes, x, y, z) {
    return axes[0].map((value, i) => value * x + axes[1][i] * y + axes[2][i] * z);
  }
  function dot(a, b) {
    return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  }
  // Resample the map only when the view moves. All three cards share this bitmap.
  function updateGlobe(camera) {
    const pixels = globePixels.data;
    for (let row = 0; row < globeSize; row++) {
      for (let col = 0; col < globeSize; col++) {
        const x = (col + .5) / radius - 1;
        const y = 1 - (row + .5) / radius;
        const rr = x * x + y * y;
        if (rr >= 1) continue;
        const z = Math.sqrt(1 - rr);
        const [wx, wy, wz] = combine(camera, x, y, z);
        const lat = Math.asin(Math.max(-1, Math.min(1, wy)));
        const lon = Math.atan2(wx, wz);
        const shade = .52 + .42 * Math.max(0, .76 * z - .42 * x + .45 * y);
        const grid = Math.abs(Math.sin(lat * 6)) < .018 || Math.abs(Math.sin(lon * 6)) < .018;
        const dest = 4 * (row * globeSize + col);
        if (texture) {
          const u = Math.floor((lon / tau + 1.5) * texture.width) % texture.width;
          const v = Math.min(texture.height - 1, Math.floor((.5 - lat / Math.PI) * texture.height));
          const source = 4 * (v * texture.width + u);
          pixels[dest] = texture.data[source] * shade * .60 + 14;
          pixels[dest + 1] = texture.data[source + 1] * shade * .74 + 25;
          pixels[dest + 2] = texture.data[source + 2] * shade * .91 + 39;
        } else {
          pixels[dest] = 37 * shade;
          pixels[dest + 1] = 95 * shade;
          pixels[dest + 2] = 144 * shade;
        }
        if (grid) {
          pixels[dest] += 18;
          pixels[dest + 1] += 22;
          pixels[dest + 2] += 24;
        }
        pixels[dest + 3] = 255;
      }
    }
    globeContext.putImageData(globePixels, 0, 0);
    globeDirty = false;
  }

  const curve = (steps, point) => Array.from({length: steps + 1}, (_, i) => point(i / steps));
  const ring = (size, height) => curve(32, t => [size * Math.cos(t * tau), height, size * Math.sin(t * tau)]);
  const designs = [
    { color: '#80eced', shadow: '#28586e', pivot: [0, 108, 0], paths: [
      ring(10, 2), ring(7, 8), [[0, 3, 0], [0, 18, -24], [0, 98, -24], [0, 108, 0]],
    ] },
    { color: '#ffcd82', shadow: '#815336', pivot: [0, 103, 0], paths: [
      [[-31, -2, 0], [-27, 98, 0], [-19, 106, 0], [19, 106, 0], [27, 98, 0], [31, -2, 0]],
      [[-39, 1, 0], [-23, 1, 0]], [[23, 1, 0], [39, 1, 0]],
    ] },
    { color: '#c6b5ff', shadow: '#62548a', pivot: [0, 106, 0], paths: [
      ring(35, 1), curve(24, t => [0, 108 * Math.sin(t * Math.PI), 35 * Math.cos(t * Math.PI)]),
    ] },
  ];
  function circle(ctx, x, y, size, fill) {
    ctx.beginPath();
    ctx.arc(x, y, size, 0, tau);
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function draw(timestamp) {
    const camera = basis(pitch, yaw);
    if (globeDirty) updateGlobe(camera);
    const marks = locations.map(([, lat, lon]) => {
      const [, , normal] = basis(lat * radians, lon * radians);
      return camera.map(axis => dot(normal, axis));
    });
    const [, latitude, longitude] = locations[selected];
    const [east, north, normal] = basis(latitude * radians, longitude * radians);
    const local = [east, normal, north];
    const delta = previousFrame === undefined ? 0 : Math.min(50, timestamp - previousFrame);
    previousFrame = timestamp;
    elapsed += delta;
    // Accelerated demonstration: the sign and relative speed follow latitude.
    heading -= delta * .00068 * Math.sin(latitude * radians);
    const swing = .39 * Math.sin(elapsed / 320);
    const alongPlane = (distance, height) => [
      distance * Math.cos(heading), height, distance * Math.sin(heading),
    ];
    // Record the bob at fixed intervals on the local tangent plane.
    if (elapsed - lastTrailSample >= 25) {
      trail.push(alongPlane(64 * Math.sin(swing), 5));
      if (trail.length > 480) trail.shift();
      lastTrailSample = elapsed;
    }
    contexts.forEach((ctx, index) => {
      const design = designs[index];
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      ctx.drawImage(globe, center[0] - radius, center[1] - radius);
      marks.forEach(([x, y, z], i) => {
        if (z <= 0) return;
        const size = i === selected ? 6 : 4.5;
        circle(ctx, center[0] + x * radius, center[1] - y * radius, size + 3, '#102238');
        circle(ctx, center[0] + x * radius, center[1] - y * radius, size, i === selected ? design.color : '#e4f2ff');
      });
      function project([x, y, z]) {
        const world = combine(local, x, radius + y, z);
        return camera.map(axis => dot(world, axis));
      }
      function visible([x, y, z]) {
        return z > 0 || x * x + y * y > radius * radius;
      }
      function stroke(paths, color, width) {
        ctx.beginPath();
        paths.forEach(points => {
          for (let i = 1; i < points.length; i++) {
            const a = project(points[i - 1]);
            const b = project(points[i]);
            if (!visible(a) || !visible(b)) continue;
            ctx.moveTo(center[0] + a[0], center[1] - a[1]);
            ctx.lineTo(center[0] + b[0], center[1] - b[1]);
          }
        });
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
      const pendulumPoint = angle => alongPlane(
        64 * Math.sin(angle), design.pivot[1] - 64 * Math.cos(angle),
      );
      const arc = curve(24, t => pendulumPoint((t - .5) * .78));
      const sector = [design.pivot, ...arc, design.pivot].map(project);
      if (sector.every(visible)) {
        ctx.beginPath();
        sector.forEach(([x, y], i) => {
          if (i === 0) ctx.moveTo(center[0] + x, center[1] - y);
          else ctx.lineTo(center[0] + x, center[1] - y);
        });
        ctx.fillStyle = design.color + '70';
        ctx.fill();
      }
      stroke([[arc[0], design.pivot, arc.at(-1)]], design.color + 'c0', 2.1);
      stroke([trail], '#0b1422a0', 4.5);
      stroke([trail], design.color + 'dc', 2.3);
      stroke(design.paths, '#0b1422', 4.2);
      stroke(design.paths, design.color + 'a0', 1.8);

      stroke([arc], design.color, 2.8);
      const bob = pendulumPoint(swing);
      stroke([[design.pivot, bob]], '#e6f1f9', 2.2);
      const [x, y, z] = project(bob);
      if (visible([x, y, z])) {
        const bx = center[0] + x;
        const by = center[1] - y;
        const metal = ctx.createRadialGradient(bx - 3, by - 4, 1, bx, by, 9);
        metal.addColorStop(0, '#fff');
        metal.addColorStop(.36, design.color);
        metal.addColorStop(1, design.shadow);
        circle(ctx, bx, by, 9, metal);
      }
    });
    frame = requestAnimationFrame(draw);
  }
  frame = requestAnimationFrame(draw);
  document.addEventListener('visibilitychange', () => {
    cancelAnimationFrame(frame);
    previousFrame = undefined;
    if (!document.hidden) frame = requestAnimationFrame(draw);
  });

  canvases.forEach(canvas => {
    canvas.addEventListener('pointerdown', event => {
      if (drag) return;
      drag = { id: event.pointerId, x: event.clientX, y: event.clientY, yaw, pitch };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove', event => {
      if (drag?.id !== event.pointerId) return;
      const factor = Math.PI / canvas.clientWidth;
      yaw = drag.yaw - (event.clientX - drag.x) * factor;
      pitch = Math.max(-1.54, Math.min(1.54, drag.pitch + (event.clientY - drag.y) * factor));
      globeDirty = true;
    });
    canvas.addEventListener('pointerup', event => {
      if (drag?.id !== event.pointerId) return;
      const moved = Math.hypot(event.clientX - drag.x, event.clientY - drag.y);
      drag = undefined;
      if (moved > 5) return;
      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left) * canvas.width / rect.width - center[0];
      const y = center[1] - (event.clientY - rect.top) * canvas.height / rect.height;
      const camera = basis(pitch, yaw);
      const hit = locations.findIndex(([, lat, lon]) => {
        const normal = basis(lat * radians, lon * radians)[2];
        return dot(normal, camera[2]) > 0 &&
          Math.hypot(x - radius * dot(normal, camera[0]), y - radius * dot(normal, camera[1])) < 16;
      });
      if (hit >= 0) select(hit);
    });
    canvas.addEventListener('lostpointercapture', () => { drag = undefined; });
  });
</script>
</html>
