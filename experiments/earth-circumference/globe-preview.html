<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3D 地球</title>
  <link rel="icon" href="data:,">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #earth {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      touch-action: none;
      cursor: grab;
      outline: none;
    }

    canvas:active {
      cursor: grabbing;
    }

    canvas[data-orbit-axis="pending"] {
      cursor: crosshair;
    }

    canvas[data-orbit-axis="x"] {
      cursor: ns-resize;
    }

    canvas[data-orbit-axis="y"] {
      cursor: ew-resize;
    }

    canvas:focus-visible {
      outline: 2px solid #d7e9ff;
      outline-offset: -4px;
    }

    canvas[data-orbit-axis]:focus-visible {
      outline: none;
    }

    .constraint-hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      padding: 8px 14px;
      transform: translateX(-50%);
      border: 1px solid #6684a6;
      border-radius: 999px;
      background: #08111ee6;
      color: #d7e9ff;
      font: 600 14px/1.4 system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    .constraint-hint[hidden] {
      display: none;
    }

    .view-controls {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
    }

    .switch-row {
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid #2f435d;
      border-radius: 14px;
      background: #07101de6;
    }

    .switch-row button {
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #93a8c2;
      font: 600 14px/1 system-ui, sans-serif;
      cursor: pointer;
    }

    .switch-row button:hover,
    .switch-row button:focus-visible {
      color: #e6f2ff;
      background: #172a42;
      outline: 1px solid #6f8eaf;
      outline-offset: -1px;
    }

    .switch-row button[aria-pressed="true"] {
      color: #f2f7ff;
      background: #294665;
      box-shadow: inset 0 0 0 1px #7c9abc;
    }

    .polar-edge-control {
      width: 290px;
      padding: 10px 12px 12px;
      border: 1px solid #2f435d;
      border-radius: 14px;
      background: #07101de6;
      color: #a9bdd5;
      font: 600 13px/1.3 system-ui, sans-serif;
    }

    .edge-heading,
    .edge-presets {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .edge-heading output {
      color: #eef6ff;
      font-variant-numeric: tabular-nums;
    }

    .polar-edge-control input {
      width: 100%;
      height: 28px;
      margin: 4px 0;
      accent-color: #78a8db;
      cursor: ew-resize;
    }

    .edge-presets {
      justify-content: flex-end;
    }

    .edge-presets button {
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid #3f5874;
      border-radius: 8px;
      background: #10233a;
      color: #a9bdd5;
      font: inherit;
      cursor: pointer;
    }

    .edge-presets button:hover,
    .edge-presets button:focus-visible,
    .edge-presets button[aria-pressed="true"] {
      border-color: #7899ba;
      background: #294665;
      color: #f2f7ff;
      outline: none;
    }

    [role="alert"] {
      position: absolute;
      margin: 0;
      color: #d7e9ff;
      font: 16px/1.6 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <main id="earth" aria-label="3D 地球预览，拖动旋转，按住 Ctrl 按固定角度旋转，滚轮缩放">
    <div class="view-controls">
      <div class="switch-row" role="group" aria-label="地球投影方式">
        <button type="button" data-projection="orthographic" aria-pressed="true">3D 球体</button>
        <button type="button" data-projection="north-polar" aria-pressed="false">北极极坐标</button>
      </div>
      <div class="switch-row" role="group" aria-label="地球纹理">
        <button type="button" data-texture="handdrawn" aria-pressed="true">手绘纹理</button>
        <button type="button" data-texture="original" aria-pressed="false">原始纹理</button>
      </div>
      <div class="switch-row" role="group" aria-label="光照">
        <button type="button" data-lighting="sunlit" aria-pressed="true">太阳高光</button>
        <button type="button" data-lighting="diffuse" aria-pressed="false">无高光</button>
        <button type="button" data-lighting="unlit" aria-pressed="false">无光照</button>
      </div>
      <div class="switch-row" role="group" aria-label="笔刷">
        <button type="button" data-brush="on" aria-pressed="true">笔刷</button>
        <button type="button" data-brush="off" aria-pressed="false">无笔刷</button>
      </div>
      <div class="polar-edge-control" role="group" aria-labelledby="polarEdgeLabel">
        <div class="edge-heading">
          <label id="polarEdgeLabel" for="polarEdge">极坐标外缘</label>
          <output id="polarEdgeValue" for="polarEdge">60.00°N</output>
        </div>
        <input id="polarEdge" type="range" min="0" max="89" step="0.01" value="60"
               aria-valuetext="北纬 60.00 度">
        <div class="edge-presets">
          <button type="button" data-polar-edge="60" aria-pressed="true">60°N</button>
          <button type="button" data-polar-edge="23.44" aria-pressed="false">北回归线</button>
        </div>
      </div>
    </div>
    <p class="constraint-hint" id="constraintHint" role="status" aria-live="polite" hidden></p>
  </main>
  <script type="module">
    import { createEarthGlobe } from './components/earth-globe/index.js';

    const earth = document.querySelector('#earth');
    const constraintHint = document.querySelector('#constraintHint');
    const projectionButtons = [...document.querySelectorAll('[data-projection]')];
    const textureButtons = [...document.querySelectorAll('[data-texture]')];
    const lightingButtons = [...document.querySelectorAll('[data-lighting]')];
    const brushButtons = [...document.querySelectorAll('[data-brush]')];
    const polarEdge = document.querySelector('#polarEdge');
    const polarEdgeValue = document.querySelector('#polarEdgeValue');
    const polarEdgeButtons = [...document.querySelectorAll('[data-polar-edge]')];
    const globe = createEarthGlobe(earth);
    projectionButtons.forEach((button) => {
      button.addEventListener('click', () => globe.setProjection(button.dataset.projection));
    });
    earth.addEventListener('earth-globe-projection', ({ detail }) => {
      earth.dataset.projection = detail.projection;
      constraintHint.hidden = true;
      projectionButtons.forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.projection === detail.projection));
      });
    });
    textureButtons.forEach((button) => {
      button.addEventListener('click', () => globe.setTextureStyle(button.dataset.texture));
    });
    earth.addEventListener('earth-globe-texture', ({ detail }) => {
      earth.dataset.textureStyle = detail.textureStyle;
      textureButtons.forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.texture === detail.textureStyle));
      });
    });
    lightingButtons.forEach((button) => {
      button.addEventListener('click', () => globe.setLightingMode(button.dataset.lighting));
    });
    earth.addEventListener('earth-globe-lighting', ({ detail }) => {
      earth.dataset.lighting = detail.mode;
      lightingButtons.forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.lighting === detail.mode));
      });
    });
    brushButtons.forEach((button) => {
      button.addEventListener('click', () => globe.setBrushEnabled(button.dataset.brush === 'on'));
    });
    earth.addEventListener('earth-globe-brush', ({ detail }) => {
      earth.dataset.brush = detail.enabled ? 'on' : 'off';
      brushButtons.forEach((button) => {
        button.setAttribute(
          'aria-pressed',
          String((button.dataset.brush === 'on') === detail.enabled),
        );
      });
    });
    function paintPolarEdge(latitude) {
      polarEdge.value = String(latitude);
      polarEdgeValue.value = `${latitude.toFixed(2)}°N`;
      polarEdge.setAttribute('aria-valuetext', `北纬 ${latitude.toFixed(2)} 度`);
      polarEdgeButtons.forEach((button) => {
        button.setAttribute(
          'aria-pressed',
          String(Math.abs(Number(button.dataset.polarEdge) - latitude) < 0.005),
        );
      });
    }
    polarEdge.addEventListener('input', () => {
      globe.setProjection('north-polar');
      globe.setPolarOuterLatitude(Number(polarEdge.value));
    });
    polarEdgeButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const latitude = Number(button.dataset.polarEdge);
        globe.setPolarOuterLatitude(latitude);
        globe.setProjection('north-polar');
      });
    });
    earth.addEventListener('earth-globe-polar-edge', ({ detail }) => paintPolarEdge(detail.latitude));
    earth.addEventListener('earth-globe-constraint', ({ detail }) => {
      constraintHint.hidden = !detail.active;
      if (!detail.active) return;
      const axisName = detail.axis === 'y' ? 'Y' : 'X';
      constraintHint.textContent = `Ctrl · ${axisName} 轴 · ${Math.abs(detail.angle)}°`;
    });
    addEventListener('pagehide', () => globe.destroy(), { once: true });
  </script>
</body>
</html>
