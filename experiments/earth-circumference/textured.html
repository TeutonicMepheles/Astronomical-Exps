<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>地球朝向 · 纹理版（EXP-04 并行方向）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/globe-textured.css">
</head>
<body>
<div class="stage" id="stage" data-overview-zoom="1.35" data-overview-offset-y="46">

  <!-- 星空：一次性生成，纯矢量 -->
  <svg class="starfield" id="starfield" viewBox="0 0 1600 900" aria-hidden="true"></svg>

  <!-- 太阳辉光与光柱：参考图原图拆片（含太阳盘、光柱、星野），screen 混合叠加 -->
  <div class="sun-glow" aria-hidden="true"></div>

  <!-- 中央地球：纹理 + 晨昏线 + 大气边缘 -->
  <canvas id="globe" aria-label="可旋转的地球，拖动改变自转角度" role="img"></canvas>

  <!-- 太阳平行光线（方向固定） -->
  <svg class="sun-arrows" viewBox="0 0 1600 900" aria-hidden="true">
    <defs>
      <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="3.1" markerHeight="3.1" orient="auto-start-reverse">
        <path d="M10 0 L0 5 L10 10 z" fill="#E8703A"></path>
      </marker>
      <linearGradient id="rayA" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F7B48A" stop-opacity=".18"></stop>
        <stop offset="1" stop-color="#E8703A" stop-opacity=".95"></stop>
      </linearGradient>
    </defs>
    <g class="sun-beams">
      <image id="beam0" href="assets/shaft-single.png" width="206" height="123" aria-hidden="true"></image>
      <image id="beam1" href="assets/shaft-single.png" width="206" height="123" aria-hidden="true"></image>
      <image id="beam2" href="assets/shaft-single.png" width="206" height="123" aria-hidden="true"></image>
      <image id="beam3" href="assets/shaft-single.png" width="206" height="123" aria-hidden="true"></image>
      <image id="beam4" href="assets/shaft-single.png" width="206" height="123" aria-hidden="true"></image>
    </g>
  </svg>

  <!-- 地轴与朝向手柄 -->
  <svg class="axis-layer" viewBox="0 0 1600 900" aria-hidden="true">
    <line id="axisLine" class="axis-line" x1="0" y1="0" x2="0" y2="0"></line>
  </svg>
  <div class="axis-grip" id="axisGrip" role="slider" tabindex="0"
       aria-label="地球朝向（示意范围 11 度到 36 度）" aria-valuemin="11" aria-valuemax="36" aria-valuenow="23.5">
    <span class="axis-grip-dot"></span>
  </div>

  <!-- 经纬度标记：随地球转动，背面自动隐藏 -->
  <div class="geo-marker geo-subsolar" data-subsolar>
    <span class="geo-dot"></span>
    <span class="geo-label"><b>太阳直射点</b><i><span data-lat>—</span>, <span data-lon>—</span></i></span>
  </div>
  <div class="geo-marker geo-selected" data-selectable data-latlon="-23.5,135" title="拖动我选择位置">
    <span class="geo-ring"></span>
    <span class="geo-label"><b>已选择的位置</b><i>23.5° S, 135.0° E</i></span>
  </div>

  <div class="panel">
    <div class="panel-grain" aria-hidden="true"></div>
    <div class="panel-title">已选择的位置</div>
    <div class="panel-row">
      <div class="panel-cell"><span>纬度</span><strong id="selectedLat">23.5° S</strong></div>
      <div class="panel-divider"></div>
      <div class="panel-cell"><span>经度</span><strong id="selectedLon">135.0° E</strong></div>
    </div>
  </div>

  <!-- 测量视角：沿经线的弧与距离 -->
  <svg class="measure-layer" id="measureLayer" viewBox="0 0 1600 900" aria-hidden="true" hidden>
    <path id="arcPath" fill="none" stroke="#8ec5ff" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="9 7" opacity="0"></path>
  </svg>
  <div class="measure-label" id="measureLabel" hidden></div>



  <div class="seasons" id="seasons">
    <div class="season" data-pos="0">
      <img class="season-icon" src="assets/cut/icon-spring.png" alt="" aria-hidden="true"><span>春季</span>
    </div>
    <div class="season" data-pos="1">
      <img class="season-icon" src="assets/cut/icon-summer.png" alt="" aria-hidden="true"><span>夏季</span>
    </div>
    <div class="season" data-pos="2">
      <img class="season-icon" src="assets/cut/icon-autumn.png" alt="" aria-hidden="true"><span>秋季</span>
    </div>
    <div class="season" data-pos="3">
      <img class="season-icon" src="assets/cut/icon-winter.png" alt="" aria-hidden="true"><span>冬季</span>
    </div>
  </div>

  <div class="timeline" id="timeline" role="slider" tabindex="0"
       aria-label="年相位（示意）" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">

    <div class="ticks" id="ticks" aria-hidden="true"></div>
    <div class="timeline-caret" id="caret" aria-hidden="true"></div>
    <div class="selected-date"><output id="selectedDate" aria-live="polite"></output></div>
    <span class="timeline-end timeline-end-left">1月1日</span>
    <span class="timeline-end timeline-end-right">12月31日</span>
  </div>

  <div class="readout" id="readout">
    <span>自转 <b id="spinValue">0°</b></span>
    <span>朝向 <b id="tiltValue">23.5°</b></span>
  </div>

</div>
<script type="module" src="js/globe-textured.js"></script>

</body>
</html>
