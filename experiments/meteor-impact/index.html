<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>陨石坑 · 对照实验</title><link rel="stylesheet" href="../../shared/typography/typography.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="typography.css">
</head>
<body><main id="lab">
<header class="topbar"><h1><span>EXP.03</span> 陨石坑撞击</h1><button id="openRecords">实验记录 <b id="recordCount">0</b></button></header>

<section class="workspace"><header class="viewbar"><nav aria-label="对照方式"><button data-mode="factor" aria-pressed="true">单变量对照</button><button data-mode="world" aria-pressed="false">地球 / 月球</button></nav><div id="pairTitle">大小对照</div><label class="factor-picker">研究因素 <select id="factorSelect" aria-label="研究因素"></select></label><div class="segments"><button id="wholeView" aria-pressed="true">3D 坑体</button><button id="cutView" aria-pressed="false">立体剖面</button></div><button id="overview">三档总览</button><button id="reset">重选条件 ↺</button></header><div class="viewports">
<article class="viewport side-0"><header><b class="number">1</b><div id="inlineSettings0" class="inline-settings"></div></header><canvas id="scene0" aria-label="实验1三维撞击"></canvas><img id="result0" hidden alt="实验1三维结果"><svg id="annotations0" class="meteor-annotations" viewBox="0 0 800 700" preserveAspectRatio="xMidYMid meet" role="img" hidden></svg><div class="phase" id="phase0"></div><div class="outcomes" id="outcome0" hidden></div></article>
<article class="viewport side-1"><header><b class="number">2</b><div id="inlineSettings1" class="inline-settings"></div></header><canvas id="scene1" aria-label="实验2三维撞击"></canvas><img id="result1" hidden alt="实验2三维结果"><svg id="annotations1" class="meteor-annotations" viewBox="0 0 800 700" preserveAspectRatio="xMidYMid meet" role="img" hidden></svg><div class="phase" id="phase1"></div><div class="outcomes" id="outcome1" hidden></div></article>
</div><footer><span><strong>完全理想条件下的单变量对照实验</strong> · <span id="fixedSummary"></span></span><span id="boundaryNote">溅射范围为定性示意，当前按坑口大小等比缩放</span></footer></section><div class="experiment-controls"><div id="conditionSummary"></div><div class="launch-area"><button id="launch" class="launch">同时发射 <span>↗ ↗</span></button><button id="cancel" hidden>取消并重选</button><div id="status" role="status"></div></div></div>
<dialog id="records"><header><h2>课堂对照记录</h2><button id="closeRecords">关闭 ×</button></header><p class="record-note">完全理想条件下的单变量对照实验。溅射范围为定性示意，当前按坑口大小等比缩放。</p><div id="recordBody"></div><footer><button id="deleteLast">删除上一组</button><div><button id="previous">←</button><span id="pageNumber"></span><button id="next">→</button></div></footer></dialog>
<dialog id="overviewDialog"><header><h2 id="overviewTitle">三档结果</h2><button id="closeOverview">关闭 ×</button></header><div id="overviewCards"></div></dialog>
<script src="vendor/three.local.js"></script><script src="components/meteor-3d/meteor-3d.js"></script><script src="components/result-callouts/result-callouts.js"></script><script src="app.js"></script></main></body></html>
