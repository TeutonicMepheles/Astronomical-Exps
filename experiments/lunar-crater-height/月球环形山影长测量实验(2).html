<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月面环形山 · 影长测量演示</title>
<link rel="stylesheet" href="../../shared/typography/typography.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;color:#f0f3fa;font-family:var(--font-ui);line-height:1.6}
main{position:absolute;left:50%;top:50%;width:1600px;height:900px;display:flex;flex-direction:column;overflow:hidden;background:#0b0e14;transform:translate(-50%,-50%) scale(var(--stage-scale,1));transform-origin:center center}
header{min-height:88px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:12px 20px;background:#121923;border-bottom:1px solid #3a4653}
.heading{min-width:320px}
h1{font-size:30px;line-height:1.2;font-weight:600;margin:0;color:#f0f3fa;white-space:nowrap}
header small{display:block;margin-top:3px;font-size:13px;line-height:1.35;color:#bac7d4}
.controls{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0}
.control{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 9px;border:1px solid #3b4a59;border-radius:10px;background:#1c2631;white-space:nowrap}
.control span{font-size:14px;font-weight:500;color:#d5dfeb}
input[type=range]{width:120px;height:44px;margin:0;accent-color:#f2cc64;cursor:pointer;touch-action:none}
output{display:inline-block;min-width:37px;text-align:right;color:#ffdd82;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
button{min-height:44px;min-width:92px;padding:8px 12px;border:1px solid #596a7c;border-radius:10px;background:#273442;color:#f0f3fa;font-family:var(--font-ui);font-size:15px;font-weight:600;line-height:1.3;cursor:pointer;box-shadow:inset 0 1px #ffffff12,0 3px 9px #00000030;transition:background-color .18s,border-color .18s,box-shadow .18s}
button:hover,button.active{background:#3b4b5b;border-color:#f2cc64}
button.primary,button.primary:hover,button.primary.active{background:#d9af52;border-color:#f4d47c;color:#1d1a12}
button:focus-visible,input[type=range]:focus-visible{outline:3px solid #8ad9ff;outline-offset:3px}
button:disabled{opacity:.55;cursor:not-allowed}
.views{display:grid;grid-template-columns:1fr 1fr;min-height:0;flex:1}
.view{position:relative;min-width:0;min-height:0;background:#0b0e14}
.view:first-child{border-right:1px solid #53606a}
.view canvas{width:100%;height:100%;display:block;touch-action:none}
.view .label,.view .help{position:absolute;left:16px;padding:7px 11px;border:1px solid #53606a;border-radius:10px;background:#17202bdf;pointer-events:none}
.view .label{top:14px;color:#f0f3fa;font-size:15px;font-weight:600}
.view .help{bottom:14px;right:16px;color:#d0dce8;font-size:13px}
.result{display:flex;align-items:center;gap:24px;min-height:66px;padding:10px 20px;background:#121923;border-top:1px solid #3a4653;font-size:15px;font-variant-numeric:tabular-nums}
.result strong{color:#ffdd82;font-size:17px;font-weight:700}
.result span{color:#d0dce8}
#status{flex:1;text-align:right;color:#d0dce8}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body><main>
<header><div class="heading"><h1>月面环形山 · 影长测量</h1><small>三维地形与几何测量演示 · 数值为模型单位</small></div><div class="controls">
<label class="control"><span>剖切位置</span><input id="cut" type="range" min="-155" max="155" step="1" value="0"><output id="cutValue" for="cut">0</output></label>
<label class="control"><span>太阳高度角</span><input id="angle" type="range" min="10" max="85" step="1" value="35"><output id="angleValue" for="angle">35°</output></label>
<button id="start" class="primary" type="button">开始测量</button><button id="measure" type="button">测量影长</button><button id="height" type="button">计算高度</button><button id="clear" type="button">清除选点</button>
</div></header>
<div class="views"><section class="view"><canvas id="top"></canvas><div class="label">俯视 · 三维月面</div><div class="help" id="topHelp">拖动金色剖切线选择截面；开始测量后可沿线选点。</div></section><section class="view"><canvas id="section"></canvas><div class="label" id="sectionLabel">立体剖面</div><div class="help" id="sectionHelp">直接左右拖动剖切面调整位置；开始测量后点击选点。</div></section></div>
<div class="result"><div><span id="lengthLabel">影长 L</span>：<strong id="lengthValue">—</strong></div><div>海拔 h：<strong id="heightValue">—</strong></div><span id="formula"></span><span id="status">先选择剖切面，再开始测量。</span></div>
</main><script src="./assets/three.reference.local.js"></script><script src="./src/crater-3d.js"></script></body></html>
