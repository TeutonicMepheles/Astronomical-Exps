<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>环形山高度测量实验</title>
<link rel="stylesheet" href="../../shared/typography/typography.css">
<link rel="stylesheet" href="./src/manual-calculation.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;color:#f0f3fa;font-family:var(--font-ui);line-height:1.6}
main{position:absolute;left:50%;top:50%;width:1600px;height:900px;display:flex;flex-direction:column;overflow:hidden;background:#0b0e14;transform:translate(-50%,-50%) scale(var(--stage-scale,1));transform-origin:center center}
header{position:absolute;inset:0;z-index:5;pointer-events:none}
.heading{position:absolute;left:44px;top:34px;}
h1{font-size:26px;line-height:1.2;font-weight:500;letter-spacing:2px;margin:0;color:#eaf0ff;white-space:nowrap}
header small{display:none}
.control{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 16px;min-height:46px;white-space:nowrap}
.control input{grid-column:1/-1;grid-row:2;width:100%}
.control output{grid-column:2;grid-row:1}
.control span{font-size:14px;font-weight:500;color:#d5dfeb}
input[type=range]{height:44px;margin:0;accent-color:#e4c997;cursor:pointer;touch-action:none}
output{font-family:var(--font-ui);display:inline-block;min-width:37px;text-align:right;color:#f4dfb6;font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
button{min-height:46px;min-width:92px;padding:10px 12px;border:1px solid #647e8a;border-radius:9px;background:#1c3441;color:#e8e8df;font-family:var(--font-ui);font-size:15px;font-weight:500;line-height:1.3;cursor:pointer;transition:background-color .18s,border-color .18s}
button:hover,button.active{background:#38515b;border-color:#e5c991}
button.primary,button.primary:hover,button.primary.active{background:#e3cc9c;border-color:#e3cc9c;color:#182936}
button:focus-visible,input[type=range]:focus-visible{outline:3px solid #8ad9ff;outline-offset:3px}
button:disabled{opacity:.55;cursor:not-allowed}
.measurement-steps{position:absolute;right:48px;top:28px;display:flex;gap:10px;pointer-events:auto;margin:0;padding:0;list-style:none}
.lunar-solar-altitude{position:absolute;isolation:isolate;right:48px;top:88px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right;color:#e8eef0;font-size:var(--type-data-label);line-height:1.3}
.lunar-solar-altitude::before{content:"";position:absolute;inset:-24px -48px -26px -72px;z-index:-1;background:radial-gradient(ellipse at 78% 42%,#05091299,transparent 72%)}
.lunar-solar-altitude span{color:#fff0c9;font-size:var(--type-number);font-weight:500;font-variant-numeric:tabular-nums;text-shadow:0 0 6px #ffdfa87a,0 0 16px #ffc8753d}
.measurement-steps li{display:flex;gap:10px;align-items:center;min-height:48px;color:#8297a2;font-size:16px;font-weight:400}
.measurement-steps li+li::before{content:"";width:16px;height:3px;margin-right:4px;background:#40515b}
.measurement-steps b{display:grid;place-items:center;width:32px;height:32px;border:3px solid #52636e;border-radius:50%;font-size:18px;font-weight:400}
.measurement-steps li.active{color:#e9d9b6}.measurement-steps li.active b{background:#ddc79e;border-color:#ddc79e;color:#172530}
.measurement-steps li.done b{border-color:#617a80;color:#b9ded2;box-shadow:inset 0 0 0 1px #b9ded2}
.measurement-steps li.done b{font-weight:700}
.measurement-steps li[role="button"]{cursor:pointer}
.step-entry-note { position:absolute;right:0;top:100%;width:max-content;max-width:470px;padding:10px 14px;border:1px solid #64778c;border-radius:8px;background:#17283c;color:#f9e4ba;font-size:17px;z-index:1; }
.step-entry-note[hidden] { display:none; }
header > .step-entry-note { top:80px;right:48px; }

.step-guide{position:static;color:#d8e2e8}
.step-guide h2{font-size:18px;font-weight:500;margin:0 0 7px;color:#eddab4}.step-guide p{font-size:14px;line-height:1.65;margin:5px 0;max-width:560px}.step-guide button{pointer-events:auto;margin-top:10px;min-width:120px}.step-guide .step-action{display:flex;align-items:center;justify-content:space-between;gap:18px}.step-guide .step-action p{max-width:460px}.step-guide .step-action button{flex-shrink:0;margin-top:0}.step-guide [hidden],[hidden]{display:none!important}
.step-guide .completed-note{color:#a7c7bc}.step-guide #status{font-size:13px;color:#b1c8d2;margin:5px 0}
#clear{background:#1b303e;border-color:#526b79;color:#a5b6bf}
#clear:hover{background:#2d434b;border-color:#597078;color:#f2e1bd}
.views{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.view{position:relative;min-width:0;min-height:0;background:#0b0e14}
.view.top{order:1;border:0;--scope-radius:320px;background:#030507}
.view.top::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:#030507 url('./assets/telescope-eyepiece/seedream55-barrel.webp') center / 1280px 1280px no-repeat;mask-image:radial-gradient(circle at 50% 50%,transparent 319.5px,#000 320px);box-shadow:inset 0 0 90px 24px #0008}
.views::after{content:"";position:absolute;left:calc(50% - 64px);top:0;bottom:0;width:128px;z-index:4;pointer-events:none;background:linear-gradient(90deg,transparent,#102033cc 50%,transparent)}
main::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(180deg,#0b1928e6,transparent 16%,transparent 76%,#0b192880)}
.view.top::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 319.5px,#020304 320px,#05080a 322px,#344047 324px,#1a2329 327px,#0c1115 332px,#030507 338px,transparent 345px)}
#top{clip-path:circle(var(--scope-radius) at 50% 50%)}
.view.side{order:2;background:#10203e}
.view.side::before{content:"";position:absolute;z-index:0;top:0;left:0;right:0;height:360px;pointer-events:none;background:url('./风格化月面参考/图片节点 5.png') right top / auto 1000px no-repeat;mask-image:linear-gradient(#000 0%,#000 65%,transparent 100%)}
.view.side::before{height:100%;background-image:url('./风格化月面参考/宇宙背景.png');background-position:left top;background-size:100% auto;background-repeat:no-repeat;mask-image:none}
.view canvas{position:relative;z-index:1;width:100%;height:100%;display:block;touch-action:none}
.result{display:grid;grid-template-columns:1fr 1fr;gap:5px 24px;font-size:16px;font-variant-numeric:tabular-nums;margin-top:12px;padding-top:12px;border-top:1px solid #506571}
.lunar-closeup{position:absolute;right:48px;bottom:310px;z-index:5;width:390px;height:300px;padding:12px 16px;border:1px solid #58717b;border-radius:16px;background:#152735;box-sizing:border-box}
.lunar-closeup[hidden]{display:none}
.lunar-closeup header{position:static;display:flex;justify-content:space-between;align-items:center;height:30px;color:#f2e1bd;font-size:15px;letter-spacing:1px}
.lunar-closeup header span{font-size:12px;letter-spacing:0;color:#a5b6bf}
.lunar-closeup-viewport{position:relative;height:226px;overflow:hidden;border-radius:12px;background:linear-gradient(#172d40,#35434a)}
.lunar-closeup-viewport canvas,.lunar-closeup-viewport svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lunar-closeup footer{margin-top:5px;font-size:12px;color:#a5b6bf;line-height:1.4}
.result strong{color:#e5c991;font-size:24px;font-weight:600}
.result span{color:#d0dce8}
#formula{grid-column:1/-1;font-size:14px}
#formula:empty{display:none}
.rim-candidate:hover .rim-dot,.rim-candidate[data-selected="true"] .rim-dot,.rim-candidate:focus .rim-dot{fill:#ffffff}
.rim-candidate:focus{outline:none;filter:drop-shadow(0 0 4px #fff1bf)}

.lunar-panel{position:absolute;z-index:6;padding:16px 20px;border:1px solid #526b79;border-radius:14px;background:#112430f5;box-shadow:0 8px 24px #0004;color:#d8e2e8}
.lunar-rim-panel{left:80px;bottom:44px;width:640px;padding:10px}
.lunar-rim-panel #pickInstruction{display:none}
.lunar-rim-panel h2{font-size:18px;font-weight:500;color:#eddab4;margin:0 0 4px}
.lunar-rim-panel .step-guide p{max-width:none;margin:4px 0}
.lunar-rim-controls{display:flex;align-items:center;gap:16px;margin-top:8px}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
<link rel="stylesheet" href="typography.css">
<link rel="stylesheet" href="../../shared/components/operation-tip.css">
<link rel="stylesheet" href="components/stepped-slider.css">
</head>
<body><main>
<header><div class="heading"><h1>环形山高度测量实验</h1><small>三维地形与几何测量演示</small></div><ol class="measurement-steps" aria-label="测量进度"><li data-step="light" class="active" aria-current="step"><b>1</b><span class="step-name">选择光照</span></li><li data-step="start"><b>2</b><span class="step-name">框出轮廓</span></li><li data-step="measure"><b>3</b><span class="step-name">标定测量点</span></li><li data-step="height"><b>4</b><span class="step-name">计算高度差</span></li></ol><div class="lunar-solar-altitude">太阳高度角 <span id="solarAltitudeReadout">35°</span></div></header>
<div class="views"><section class="view top"><section class="lunar-panel" id="lightPanel" aria-label="光照设置"><div class="lunar-stepped-slider"><div class="lunar-stepped-stepper"><button type="button" data-nudge="-5" data-speed="coarse" aria-label="太阳高度角减少 5 度">−5°</button><button type="button" data-nudge="-1" aria-label="太阳高度角减少 1 度">−1°</button></div><label class="lunar-stepped-bar"><span>太阳高度角</span><output id="angleValue" for="angle" aria-hidden="true">35°</output><input id="angle" type="range" min="35" max="70" step="1" value="35"></label><div class="lunar-stepped-stepper"><button type="button" data-nudge="1" aria-label="太阳高度角增加 1 度">+1°</button><button type="button" data-nudge="5" data-speed="coarse" aria-label="太阳高度角增加 5 度">+5°</button></div></div></section><section class="lunar-panel lunar-rim-panel" id="rimPanel" aria-label="轮廓与选点" hidden><div class="lunar-rim-controls"><div class="lunar-stepped-slider"><div class="lunar-stepped-stepper"><button type="button" data-nudge="-5" aria-label="辅助圆大小减少 5">−5</button></div><label class="lunar-stepped-bar"><span>辅助圆大小</span><output id="rimRadiusValue" for="rimRadius" aria-hidden="true">110</output><input id="rimRadius" type="range" min="70" max="140" step="5" value="110"></label><div class="lunar-stepped-stepper"><button type="button" data-nudge="5" aria-label="辅助圆大小增加 5">+5</button></div></div></div></section><div class="lunar-manual-tools">
<button id="manualHistory" type="button" aria-haspopup="dialog" aria-label="打开实验记录" title="实验记录" hidden><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M8 7h8m-8 5h1m3 0h1m3 0h.1M8 16h1m3 0h1m3 0h.1"/></svg></button>
<form id="manualEntry" hidden>
<label for="manualLength">水平影长</label>
<input id="manualLength" type="number" inputmode="decimal" min="0" step="any" required>
<span>cm</span>
<button id="manualConfirm" type="submit" aria-label="确认影长" disabled>✓</button>
<button id="manualCancel" type="button" aria-label="取消测量">×</button>
</form></div><canvas id="top" aria-label="月面俯视图"></canvas></section><section class="view side"><div class="lunar-stage-actions" role="group" aria-label="测量阶段操作"><button id="previousStep" type="button" aria-label="上一步" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 12H5m6-6-6 6 6 6"/></svg></button><button id="start" class="primary lunar-primary-action" type="button" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg><span>确认轮廓</span></button><button id="confirmLight" class="primary lunar-primary-action" type="button" aria-label="前往测量" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg><span>前往测量</span></button><button id="manualCalculation" class="lunar-primary-action" type="button" aria-controls="manualEntry" aria-expanded="false" hidden>手动测量</button><button id="height" class="primary lunar-primary-action" type="button" hidden disabled>自动测高</button></div><canvas id="section" aria-label="环形山剖面图"></canvas></section></div>
<section class="lunar-closeup" id="lunarCloseup" aria-label="影长测量局部放大" hidden><header>影长测量 · 局部放大<span id="closeupScale"></span></header><div class="lunar-closeup-viewport"><canvas id="closeupCanvas" aria-hidden="true"></canvas><svg id="closeupOverlay" role="img" aria-label="选取的 A、B 两点及水平影长"></svg></div><footer id="closeupCaption">当前选点的剖面细节</footer></section>


<dialog id="lunarManualDialog" class="lunar-manual" aria-labelledby="manualTitle">
  <header class="manual-heading">
    <h2 id="manualTitle">高度计算器</h2>
    <button id="manualClose" type="button" aria-label="关闭高度计算器">×</button>
  </header>
  <p id="manualEmpty">暂无记录。选中测量点并确认手动测量后，结果会显示在这里。</p>
  <div id="manualRecords" class="manual-records" aria-label="手动测量记录"></div>
  <footer class="manual-footer">
    <p id="manualFormula">L = 手量影长 × 比例尺；Δh = L × tan(α)</p>
    <nav class="manual-pages" aria-label="记录翻页" hidden>
      <button id="manualPreviousPage" type="button" aria-label="上一页记录">←</button>
      <output id="manualPage"></output>
      <button id="manualNextPage" type="button" aria-label="下一页记录">→</button>
    </nav>
    <label class="manual-scale-length" for="manualScaleLength">
      <svg id="manualScaleBar" height="16" fill="none" stroke="#f2d59a" stroke-width="2.5" aria-hidden="true"><path/></svg>
      <span><span id="manualScaleKm"></span> km 标尺实测长度</span>
      <input id="manualScaleLength" type="number" inputmode="decimal" min="0" step="any" placeholder="输入">
      <span>cm</span>
    </label>
  </footer>
</dialog>
</main><script src="./assets/three.reference.local.js"></script><script src="./assets/reference-terrain.js"></script><script src="./src/reference-terrain.js"></script><script src="./src/rim-measurement.js?v=dc1a3b640842"></script><script src="../../shared/components/operation-tip.js"></script><script src="./src/crater-3d.js?v=153477f2d9df"></script><script src="./src/manual-calculation.js?v=6f48e7b5db9b"></script></body></html>
