<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>月面环形山 · 影子测高演示</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;padding:16px 16px 40px;
    background:radial-gradient(circle at 50% -10%,#1b2140 0%,#0a0c16 55%,#05060b 100%);
    color:#e6e8f0;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;
  }
  h1{font-size:19px;font-weight:600;margin:2px 0 14px;letter-spacing:2px;color:#cfd6f5;}
  h1 small{font-size:12px;color:#8a92b5;letter-spacing:0;font-weight:400;margin-left:10px;}
  .wrap{width:1040px;max-width:100%;}
  canvas{
    width:100%;display:block;border-radius:14px;background:#0b0d16;
    box-shadow:0 10px 50px rgba(0,0,0,.7),0 0 0 1px rgba(120,150,255,.14);
    cursor:crosshair;touch-action:none;
  }
  .controls{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    margin-top:14px;padding:12px 16px;border-radius:12px;
    background:rgba(20,26,48,.75);border:1px solid rgba(120,150,255,.16);
  }
  .group{display:flex;align-items:center;gap:10px;}
  .lbl{font-size:13px;color:#9aa4cc;white-space:nowrap;}
  input[type=range]{
    -webkit-appearance:none;width:170px;height:5px;border-radius:3px;
    background:linear-gradient(90deg,#ffd54a,#ff9d3a);outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:17px;height:17px;border-radius:50%;
    background:#fff3c4;border:2px solid #ffb300;cursor:pointer;
    box-shadow:0 0 10px rgba(255,200,60,.9);
  }
  input[type=number]{
    width:66px;padding:5px 8px;border-radius:7px;font-size:14px;
    background:#0e1224;color:#ffe082;border:1px solid rgba(255,200,80,.4);
    outline:none;text-align:center;font-weight:600;
  }
  input[type=number]:focus{border-color:#ffd54a;box-shadow:0 0 0 3px rgba(255,200,60,.15);}
  .unit{color:#ffd54a;font-weight:600;}
  button{
    padding:8px 16px;border-radius:9px;border:1px solid rgba(120,160,255,.35);
    background:linear-gradient(180deg,#2b3766,#1d2647);color:#dfe6ff;
    font-size:13.5px;font-family:inherit;cursor:pointer;transition:.16s;
  }
  button:hover{background:linear-gradient(180deg,#3a4a85,#26325e);border-color:rgba(140,180,255,.65);}
  button:active{transform:translateY(1px);}
  button.primary{
    background:linear-gradient(180deg,#ffca3a,#f0932b);color:#26190a;
    border-color:#ffd76a;font-weight:700;box-shadow:0 3px 14px rgba(240,150,40,.35);
  }
  button.primary:hover{background:linear-gradient(180deg,#ffd766,#f5a63a);}
  button.ghost{background:transparent;color:#8890b5;}
  #readout{
    margin-top:12px;padding:14px 18px;border-radius:12px;
    background:rgba(16,21,40,.8);border:1px solid rgba(120,150,255,.14);
    min-height:96px;font-size:13.5px;line-height:1.9;
  }
  .row{display:flex;gap:10px;align-items:baseline;}
  .k{color:#8b93b8;min-width:120px;}
  .v{color:#7fe3ff;font-weight:700;font-variant-numeric:tabular-nums;}
  .v.hi{color:#ffd54a;font-size:16px;}
  .hint{color:#6d7699;font-size:12.5px;}
  .formula{
    margin-top:6px;padding:8px 12px;border-radius:8px;
    background:rgba(255,200,60,.08);border-left:3px solid #ffc93a;
    color:#ffe9a8;font-size:13px;font-variant-numeric:tabular-nums;
  }
</style>
</head>
<body>

<h1>月面环形山 · 影子测高 <small>拖动太阳改变入射角 · 点击山体选点</small></h1>

<div class="wrap">
  <canvas id="cv"></canvas>

  <div class="controls">
    <div class="group">
      <span class="lbl">太阳入射角</span>
      <input id="angleRange" type="range" min="10" max="85" step="0.5" value="35">
      <input id="angleNum" type="number" min="10" max="85" step="0.5" value="35">
      <span class="unit">°</span>
    </div>
    <button id="btnMeasure">测量影长</button>
    <button id="btnHeight" class="primary">计算环形山高度</button>
    <button id="btnClear" class="ghost">清除</button>
  </div>

  <div id="readout">
    <div class="row"><span class="k">影长 L</span><span class="v" id="outLen">—</span></div>
    <div class="row"><span class="k">环形山高度 h</span><span class="v hi" id="outH">—</span></div>
    <div class="formula" id="outFormula" style="display:none"></div>
    <div class="hint" id="outHint">在右侧侧视图中点击环形山上的任意一点，放置图钉后点击「测量影长」。</div>
  </div>
</div>

<script>
(function () {
'use strict';

/* ============================================================
   画布与布局
   ============================================================ */
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const CW = 1040, CH = 640;
cv.width = CW; cv.height = CH;

const TOP  = { x0: 20, y0: 66, w: 440, h: 440 };
const TOP_CX = TOP.x0 + TOP.w / 2;
const TOP_CY = TOP.y0 + TOP.h / 2;

const SIDE = { x0: 540, y0: 66, x1: 1020, y1: 600, groundY: 520 };
const SIDE_CX = 780;
const S = 1.5;                       // 模型单位 -> 像素

/* ============================================================
   高度场：不规则环形山（参照真实月球环形山：外缘山脊 + 内壁 + 中央峰）
   ============================================================ */
function rimRadius(th) {
  // 山脊半径随角度起伏，形成不规则轮廓
  return 88
       + 10 * Math.sin(3 * th + 1.2)
       +  6 * Math.sin(5 * th + 0.4)
       +  4 * Math.cos(2 * th - 0.8);
}

function heightAt(x, y) {
  const r  = Math.sqrt(x * x + y * y);
  const th = Math.atan2(y, x);
  const R  = rimRadius(th);

  // 1) 环形山外缘山脊
  const e1 = (r - R) / 15;
  let z = 46 * Math.exp(-e1 * e1);

  // 2) 内侧环形坡（坑缘内壁）
  const e2 = (r - R * 0.62) / (R * 0.28);
  z += 12 * Math.exp(-e2 * e2) * (0.75 + 0.35 * Math.sin(3 * th + 0.5));

  // 3) 中央峰
  const e3 = r / 20;
  z += 24 * Math.exp(-e3 * e3) * (0.90 + 0.25 * Math.sin(4 * th + 1.0));

  // 4) 零散小丘
  const e4 = (r - R * 0.35) / (R * 0.16);
  z += 9 * Math.exp(-e4 * e4) * (0.5 + 0.5 * Math.sin(2 * th + 2.2));

  return z > 0 ? z : 0;
}

/* ============================================================
   俯视图栅格
   ============================================================ */
const GN    = 180;
const GE    = 146;               // 覆盖范围 ±146 模型单位
const GCELL = 2 * GE / GN;
const gridH      = new Float32Array(GN * GN);
const gridShadow = new Uint8Array(GN * GN);

function g2m(i) { return -GE + (i + 0.5) * GCELL; }

for (let j = 0; j < GN; j++) {
  const y = g2m(j);
  for (let i = 0; i < GN; i++) {
    gridH[j * GN + i] = heightAt(g2m(i), y);
  }
}

const topOff    = document.createElement('canvas');
topOff.width = GN; topOff.height = GN;
const topOffCtx = topOff.getContext('2d');
const topImg    = topOffCtx.createImageData(GN, GN);

/* ============================================================
   侧视剖面（沿 y = 0 切开）
   ============================================================ */
const PROF_MIN = -160, PROF_MAX = 160, PROF_STEP = 0.5;
const PROF_N = Math.round((PROF_MAX - PROF_MIN) / PROF_STEP) + 1;
const profArr = new Float32Array(PROF_N);
for (let i = 0; i < PROF_N; i++) {
  profArr[i] = heightAt(PROF_MIN + i * PROF_STEP, 0);
}
function profAt(x) {
  const i = Math.round((x - PROF_MIN) / PROF_STEP);
  return (i < 0 || i >= PROF_N) ? 0 : profArr[i];
}

/* ============================================================
   状态
   ============================================================ */
const state = {
  theta: 35,        // 太阳入射角（与月面夹角，度）
  pin: null,        // { x, h }
  shadowLen: null,  // 测得的影长（cm）
  height: null      // 算得的高度（cm）
};

/* ============================================================
   阴影：俯视图
   ============================================================ */
function updateShadowMap() {
  const tanT = Math.tan(state.theta * Math.PI / 180);
  // 自适应步数上限
  const maxStep = Math.min(GN, Math.ceil(62 / (GCELL * Math.max(tanT, 0.05))) + 3);

  for (let j = 0; j < GN; j++) {
    const base = j * GN;
    for (let i = 0; i < GN; i++) {
      const k  = base + i;
      const z0 = gridH[k];
      let sh = 0;
      for (let s = 1; s < maxStep; s++) {
        const i2 = i + s;
        if (i2 >= GN) break;
        if (gridH[base + i2] > z0 + s * GCELL * tanT + 0.25) { sh = 1; break; }
      }
      gridShadow[k] = sh;
    }
  }
  renderTopPixels();
}

function renderTopPixels() {
  const d = topImg.data;
  for (let k = 0; k < GN * GN; k++) {
    const h = gridH[k];
    let r, g, b;
    if (gridShadow[k]) {
      r = 44; g = 47; b = 64;           // 阴影区
    } else {
      const v = 92 + h * 2.6;
      r = v * 0.97; g = v * 0.97; b = v * 1.02;
    }
    const o = k * 4;
    d[o]     = r | 0;
    d[o + 1] = g | 0;
    d[o + 2] = b | 0;
    d[o + 3] = 255;
  }
  topOffCtx.putImageData(topImg, 0, 0);
}

/* ============================================================
   阴影：侧视图
   ============================================================ */
function sideShadowed(x, z, sinT, cosT) {
  if (cosT < 1e-4) return false;        // 太阳近乎直射头顶
  let s = 1.0;
  const maxS = 420;
  while (s < maxS) {
    const xs = x + s * cosT;
    if (xs > PROF_MAX) break;
    if (profAt(xs) > z + s * sinT + 0.4) return true;
    s += 1.4;
  }
  return false;
}

/* ============================================================
   绘制：俯视图
   ============================================================ */
function drawTopView() {
  ctx.save();
  ctx.beginPath();
  ctx.rect(TOP.x0, TOP.y0, TOP.w, TOP.h);
  ctx.clip();

  ctx.fillStyle = '#080a12';
  ctx.fillRect(TOP.x0, TOP.y0, TOP.w, TOP.h);

  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(topOff, TOP.x0, TOP.y0, TOP.w, TOP.h);
  ctx.restore();

  // 外框
  ctx.strokeStyle = 'rgba(120,150,255,0.30)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(TOP.x0 + 0.5, TOP.y0 + 0.5, TOP.w - 1, TOP.h - 1);

  // 标题
  ctx.fillStyle = 'rgba(198,208,240,0.92)';
  ctx.font = '600 15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('俯视图 · 月面环形山', TOP.x0 + 2, TOP.y0 - 14);

  ctx.fillStyle = 'rgba(140,150,185,0.75)';
  ctx.font = '12px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('深色 = 山体投下的阴影', TOP.x0 + 2, TOP.y0 + TOP.h + 20);
}

/* ============================================================
   绘制：侧视图
   ============================================================ */
function sunPos() {
  const th = state.theta * Math.PI / 180;
  const R = 200;
  return {
    x: SIDE_CX + R * Math.cos(th),
    y: SIDE.groundY - R * Math.sin(th)
  };
}

function drawSideView() {
  const th   = state.theta * Math.PI / 180;
  const sinT = Math.sin(th), cosT = Math.cos(th);

  ctx.save();
  ctx.beginPath();
  ctx.rect(SIDE.x0, SIDE.y0, SIDE.x1 - SIDE.x0, SIDE.y1 - SIDE.y0);
  ctx.clip();

  // 背景
  ctx.fillStyle = '#080a14';
  ctx.fillRect(SIDE.x0, SIDE.y0, SIDE.x1 - SIDE.x0, SIDE.y1 - SIDE.y0);

  // ---- 逐列绘制地形与月面 ----
  for (let px = SIDE.x0; px < SIDE.x1; px++) {
    const mx = (px - SIDE_CX) / S;
    const z  = profAt(mx);
    const sy = SIDE.groundY - z * S;
    const sh = sideShadowed(mx, z, sinT, cosT);

    // 山体
    if (z > 0.05) {
      if (sh) {
        ctx.fillStyle = '#43475f';
      } else {
        const v = Math.min(240, 128 + z * 2.1);
        ctx.fillStyle = 'rgb(' + (v|0) + ',' + (v|0) + ',' + Math.min(255, (v * 1.05)|0) + ')';
      }
      ctx.fillRect(px, sy, 1, SIDE.groundY - sy + 0.6);
    }

    // 月面地层
    ctx.fillStyle = sh ? '#2b2e42' : '#61647a';
    ctx.fillRect(px, SIDE.groundY, 1, SIDE.y1 - SIDE.groundY);
  }

  // ---- 地形轮廓线 ----
  ctx.beginPath();
  for (let px = SIDE.x0; px < SIDE.x1; px++) {
    const mx = (px - SIDE_CX) / S;
    const sy = SIDE.groundY - profAt(mx) * S;
    if (px === SIDE.x0) ctx.moveTo(px, sy);
    else ctx.lineTo(px, sy);
  }
  ctx.strokeStyle = 'rgba(215,222,255,0.45)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // ---- 太阳光线 ----
  const sun = sunPos();
  const d = { x: -cosT, y: sinT };      // 光线传播方向（屏幕坐标）
  const n = { x:  sinT, y: cosT };      // 垂直方向

  ctx.strokeStyle = 'rgba(255,214,110,0.28)';
  ctx.lineWidth = 1.4;
  for (let k = -4; k <= 4; k++) {
    const u   = k * 44;
    const sx0 = sun.x + n.x * u + d.x * 26;
    const sy0 = sun.y + n.y * u + d.y * 26;
    ctx.beginPath();
    ctx.moveTo(sx0, sy0);
    ctx.lineTo(sx0 + d.x * 300, sy0 + d.y * 300);
    ctx.stroke();
  }

  // ---- 太阳本体 ----
  const halo = ctx.createRadialGradient(sun.x, sun.y, 4, sun.x, sun.y, 66);
  halo.addColorStop(0,   'rgba(255,236,150,0.55)');
  halo.addColorStop(0.45,'rgba(255,205,90,0.20)');
  halo.addColorStop(1,   'rgba(255,190,60,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(sun.x, sun.y, 66, 0, Math.PI * 2); ctx.fill();

  const core = ctx.createRadialGradient(sun.x - 5, sun.y - 5, 2, sun.x, sun.y, 21);
  core.addColorStop(0, '#fffbe0');
  core.addColorStop(0.6, '#ffd54a');
  core.addColorStop(1, '#f2a825');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(sun.x, sun.y, 21, 0, Math.PI * 2); ctx.fill();

  // 拖动提示环
  ctx.strokeStyle = 'rgba(255,225,130,0.55)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.arc(sun.x, sun.y, 30, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // 角度弧
  ctx.beginPath();
  const arcR = 92;
  for (let a = 0; a <= state.theta; a += 1.5) {
    const rad = a * Math.PI / 180;
    const ax = SIDE_CX + arcR * Math.cos(rad);
    const ay = SIDE.groundY - arcR * Math.sin(rad);
    if (a === 0) ctx.moveTo(ax, ay); else ctx.lineTo(ax, ay);
  }
  ctx.strokeStyle = 'rgba(255,214,110,0.65)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  // 水平参考虚线
  ctx.setLineDash([5, 5]);
  ctx.strokeStyle = 'rgba(255,214,110,0.28)';
  ctx.beginPath();
  ctx.moveTo(SIDE_CX, SIDE.groundY);
  ctx.lineTo(SIDE_CX + 150, SIDE.groundY);
  ctx.stroke();
  ctx.setLineDash([]);

  // 角度文字
  ctx.fillStyle = 'rgba(255,225,140,0.95)';
  ctx.font = '600 15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(state.theta.toFixed(1) + '°', SIDE_CX + 100, SIDE.groundY - 34);

  ctx.restore();

  // 外框
  ctx.strokeStyle = 'rgba(120,150,255,0.30)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(SIDE.x0 + 0.5, SIDE.y0 + 0.5,
                 SIDE.x1 - SIDE.x0 - 1, SIDE.y1 - SIDE.y0 - 1);

  // 标题
  ctx.fillStyle = 'rgba(198,208,240,0.92)';
  ctx.font = '600 15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('侧视图 · 环形山剖面与影子', SIDE.x0 + 2, SIDE.y0 - 14);
}

/* ============================================================
   绘制：图钉、垂线、影长
   ============================================================ */
function drawPinAndMeasure() {
  if (!state.pin) return;

  const xp = state.pin.x;
  const hp = state.pin.h;
  const X  = SIDE_CX + xp * S;
  const Yp = SIDE.groundY - hp * S;
  const Yf = SIDE.groundY;

  /* ---- 测量结果 ---- */
  if (state.shadowLen != null) {
    const L  = state.shadowLen;
    const Xs = SIDE_CX + (xp - L) * S;

    // 从 P 射向地面的光线（虚线）
    ctx.save();
    ctx.setLineDash([3, 5]);
    ctx.strokeStyle = 'rgba(255,225,130,0.55)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(X, Yp);
    ctx.lineTo(Xs, Yf);
    ctx.stroke();
    ctx.restore();

    // 垂线 P -> F
    ctx.save();
    ctx.setLineDash([7, 5]);
    ctx.strokeStyle = '#6fd4ff';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(X, Yp);
    ctx.lineTo(X, Yf);
    ctx.stroke();
    ctx.restore();

    // 影长线 F -> S（垂直于垂线）
    ctx.strokeStyle = '#ff4d70';
    ctx.lineWidth = 3.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(X, Yf);
    ctx.lineTo(Xs, Yf);
    ctx.stroke();

    // 两端刻度
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(X, Yf - 9);  ctx.lineTo(X, Yf + 9);
    ctx.moveTo(Xs, Yf - 9); ctx.lineTo(Xs, Yf + 9);
    ctx.strokeStyle = '#ff8098';
    ctx.stroke();
    ctx.lineCap = 'butt';

    // 直角标记
    const sgn = (Xs < X) ? -1 : 1;
    ctx.strokeStyle = 'rgba(120,220,255,0.8)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(X + sgn * 12, Yf);
    ctx.lineTo(X + sgn * 12, Yf - 12);
    ctx.lineTo(X, Yf - 12);
    ctx.stroke();

    // 影长标签
    const midX = (X + Xs) / 2;
    const label = '影长 ' + L.toFixed(2) + ' cm';
    ctx.font = '700 14px "PingFang SC","Microsoft YaHei",sans-serif';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(30,10,18,0.88)';
    roundRect(midX - tw / 2 - 8, Yf + 14, tw + 16, 24, 7);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,90,120,0.65)';
    ctx.lineWidth = 1.2;
    roundRect(midX - tw / 2 - 8, Yf + 14, tw + 16, 24, 7);
    ctx.stroke();

    ctx.fillStyle = '#ff8ba3';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, midX, Yf + 27);
    ctx.textBaseline = 'alphabetic';
  }

  /* ---- 高度标注 ---- */
  if (state.height != null) {
    const label = 'h = ' + state.height.toFixed(2) + ' cm';
    ctx.font = '700 14px "PingFang SC","Microsoft YaHei",sans-serif';
    const tw = ctx.measureText(label).width;
    const bx = X + 14;
    const by = (Yp + Yf) / 2 - 13;
    ctx.fillStyle = 'rgba(10,28,20,0.88)';
    roundRect(bx, by, tw + 16, 26, 7);
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,230,160,0.65)';
    ctx.lineWidth = 1.2;
    roundRect(bx, by, tw + 16, 26, 7);
    ctx.stroke();
    ctx.fillStyle = '#6cf0b0';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, bx + 8, by + 14);
    ctx.textBaseline = 'alphabetic';
  }

  /* ---- 图钉 ---- */
  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(X, Yp + 2, 7, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // 针身
  ctx.strokeStyle = '#d8dee8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(X, Yp);
  ctx.lineTo(X, Yp - 15);
  ctx.stroke();

  // 针帽
  const pinGrad = ctx.createRadialGradient(X - 3, Yp - 26, 1, X, Yp - 22, 11);
  pinGrad.addColorStop(0, '#ff9db0');
  pinGrad.addColorStop(1, '#d61c3c');
  ctx.fillStyle = pinGrad;
  ctx.beginPath();
  ctx.arc(X, Yp - 22, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath();
  ctx.arc(X - 3.5, Yp - 25.5, 2.6, 0, Math.PI * 2);
  ctx.fill();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

/* ============================================================
   主绘制
   ============================================================ */
function draw() {
  ctx.clearRect(0, 0, CW, CH);

  // 顶栏
  ctx.fillStyle = 'rgba(150,165,220,0.55)';
  ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('月面环形山 · 影子测量', CW - 24, 36);
  ctx.textAlign = 'left';

  drawTopView();
  drawSideView();
  drawPinAndMeasure();
}

/* ============================================================
   渲染调度
   ============================================================ */
let rafId = null;
let shadowDirty = true;

function requestDraw() {
  if (rafId) return;
  rafId = requestAnimationFrame(function () {
    rafId = null;
    if (shadowDirty) {
      updateShadowMap();
      shadowDirty = false;
    }
    draw();
  });
}

/* ============================================================
   角度控制
   ============================================================ */
const angleRange = document.getElementById('angleRange');
const angleNum   = document.getElementById('angleNum');

function setTheta(a, fromInput) {
  a = Math.max(10, Math.min(85, a));
  if (!isFinite(a)) return;

  state.theta = a;

  if (fromInput !== 'range') angleRange.value = a;
  if (fromInput !== 'num')   angleNum.value   = a.toFixed(1);

  // 角度变了，之前的测量作废
  resetMeasurement();

  shadowDirty = true;
  requestDraw();
}

function resetMeasurement() {
  state.shadowLen = null;
  state.height    = null;
  updateReadout();
}

angleRange.addEventListener('input', function () {
  setTheta(parseFloat(this.value), 'range');
});
angleNum.addEventListener('input', function () {
  const v = parseFloat(this.value);
  if (!isNaN(v)) setTheta(v, 'num');
});

/* ============================================================
   鼠标交互
   ============================================================ */
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (cv.width  / r.width),
    y: (e.clientY - r.top)  * (cv.height / r.height)
  };
}

let draggingSun = false;

cv.addEventListener('pointerdown', function (e) {
  const p = toCanvas(e);
  const sun = sunPos();

  // 是否点在太阳上
  const dx = p.x - sun.x, dy = p.y - sun.y;
  if (dx * dx + dy * dy < 36 * 36) {
    draggingSun = true;
    cv.setPointerCapture(e.pointerId);
    cv.style.cursor = 'grabbing';
    e.preventDefault();
    return;
  }

  // 点击侧视图放图钉
  if (p.x > SIDE.x0 && p.x < SIDE.x1 && p.y > SIDE.y0 && p.y < SIDE.y1) {
    const mx = (p.x - SIDE_CX) / S;
    if (mx < PROF_MIN + 2 || mx > PROF_MAX - 2) return;

    const h = profAt(mx);
    const th = state.theta * Math.PI / 180;
    const sinT = Math.sin(th), cosT = Math.cos(th);

    if (sideShadowed(mx, h, sinT, cosT)) {
      state.pin = null;
      state.shadowLen = null;
      state.height = null;
      updateReadout('该点位于阴影中，无法形成影子。请选择被阳光照亮的点。');
      requestDraw();
      return;
    }

    state.pin = { x: mx, h: h };
    state.shadowLen = null;
    state.height = null;
    updateReadout();
    requestDraw();
  }
});

cv.addEventListener('pointermove', function (e) {
  const p = toCanvas(e);

  if (draggingSun) {
    const dx = p.x - SIDE_CX;
    const dy = SIDE.groundY - p.y;
    let a = Math.atan2(dy, dx) * 180 / Math.PI;
    if (!isFinite(a)) a = 45;
    setTheta(a, null);
    return;
  }

  // 悬停光标
  const sun = sunPos();
  const ddx = p.x - sun.x, ddy = p.y - sun.y;
  const onSun = ddx * ddx + ddy * ddy < 36 * 36;

  if (onSun) cv.style.cursor = 'grab';
  else if (p.x > SIDE.x0 && p.x < SIDE.x1 && p.y > SIDE.y0 && p.y < SIDE.y1) {
    cv.style.cursor = 'crosshair';
  } else {
    cv.style.cursor = 'default';
  }
});

cv.addEventListener('pointerup', function (e) {
  if (draggingSun) {
    draggingSun = false;
    cv.style.cursor = 'grab';
    try { cv.releasePointerCapture(e.pointerId); } catch (err) {}
  }
});

cv.addEventListener('pointercancel', function () {
  draggingSun = false;
});

/* ============================================================
   按钮
   ============================================================ */
document.getElementById('btnMeasure').addEventListener('click', function () {
  if (!state.pin) {
    updateReadout('请先在右侧侧视图中点击环形山上的一个点。');
    return;
  }
  const h = state.pin.h;
  if (h < 0.5) {
    updateReadout('该点几乎与月面齐平，影长接近于 0。');
    return;
  }
  const tanT = Math.tan(state.theta * Math.PI / 180);
  const L = h / tanT;                     // 模型单位 = 厘米

  // 模拟"测量"读数的精度
  state.shadowLen = Math.round(L * 100) / 100;
  state.height = null;
  updateReadout();
  requestDraw();
});

document.getElementById('btnHeight').addEventListener('click', function () {
  if (!state.pin) {
    updateReadout('请先点击环形山上的一个点。');
    return;
  }
  if (state.shadowLen == null) {
    updateReadout('请先点击「测量影长」获取影子长度。');
    return;
  }
  const tanT = Math.tan(state.theta * Math.PI / 180);
  const L = state.shadowLen;
  state.height = Math.round(L * tanT * 100) / 100;
  updateReadout();
  requestDraw();
});

document.getElementById('btnClear').addEventListener('click', function () {
  state.pin = null;
  state.shadowLen = null;
  state.height = null;
  updateReadout();
  requestDraw();
});

/* ============================================================
   读数面板
   ============================================================ */
const outLen     = document.getElementById('outLen');
const outH       = document.getElementById('outH');
const outFormula = document.getElementById('outFormula');
const outHint    = document.getElementById('outHint');

function updateReadout(hintText) {
  outLen.textContent = (state.shadowLen == null)
    ? '—'
    : state.shadowLen.toFixed(2) + ' cm';

  outH.textContent = (state.height == null)
    ? '—'
    : state.height.toFixed(2) + ' cm';

  if (state.height != null) {
    const tanT = Math.tan(state.theta * Math.PI / 180);
    outFormula.style.display = 'block';
    outFormula.innerHTML =
      'h = L × tan(θ) = ' +
      state.shadowLen.toFixed(2) + ' cm × tan(' +
      state.theta.toFixed(1) + '°)' +
      ' = ' + state.shadowLen.toFixed(2) + ' × ' +
      tanT.toFixed(4) +
      ' = <b>' + state.height.toFixed(2) + ' cm</b>';
  } else {
    outFormula.style.display = 'none';
  }

  if (hintText) {
    outHint.textContent = hintText;
  } else if (!state.pin) {
    outHint.textContent = '在右侧侧视图中点击环形山上的任意一点，放置图钉后点击「测量影长」。';
  } else if (state.shadowLen == null) {
    outHint.textContent = '已放置图钉（高度 ' + state.pin.h.toFixed(1) +
      ' 单位）。点击「测量影长」画出垂线与影子。';
  } else if (state.height == null) {
    outHint.textContent = '已测得影长。点击「计算环形山高度」用三角函数求出高度。';
  } else {
    outHint.textContent = '完成！改变太阳角度或重新选点可以再测一次。';
  }
}

/* ============================================================
   启动
   ============================================================ */
updateShadowMap();
draw();
updateReadout();

})();
</script>
</body>
</html>
