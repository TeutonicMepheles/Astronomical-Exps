<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>08 细描边 · SVG 材质试样</title>
<link rel="stylesheet" href="../../shared/typography/typography.css">
<style>
:root{color-scheme:dark;--canvas:#17192e;--muted:#c3c5df;--line:#3c4160;--strength:.10;--sample:#eeedfa;--ink:#222445}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:#f8f6ff}
main{max-width:1390px;margin:auto;padding:clamp(20px,4vw,64px)}
header{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:30px}
h1,h2,h3,p{margin:0}h1{font-size:clamp(28px,4vw,48px);font-weight:500}h2{font-size:24px;font-weight:500}h3{font-size:28px;font-weight:500}
a{color:#d2cdfa;text-underline-offset:5px}button{cursor:pointer}
.settings{border-block:1px solid var(--line);padding:20px 0;display:grid;gap:22px;grid-template-columns:1fr 1fr 125px;align-items:center;margin-bottom:26px}
.settings label{display:grid;grid-template-columns:1fr auto;align-items:center;gap:5px 14px}
.settings input[type=range]{grid-column:1/-1;width:100%;margin:0;min-height:38px;accent-color:#baa9fb}
.settings output,.subtitle{color:var(--muted)}
.reset{min-height:44px;border:1px solid #726a9c;border-radius:10px;background:#272849;color:inherit;font-size:17px}
.specimen-sections{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:25px}
.specimen-sections button{font-size:16px;min-height:44px;border:1px solid #585577;border-radius:10px;background:#282b49;color:#efeefe;padding:8px 12px}
.specimen-sections button[aria-pressed=true]{background:#bcbbea;color:#222445;border-color:#bcbbea}
.card{min-width:0}.card h3{font-size:23px}.card .row{align-items:center}
.field-shell{display:inline-flex;padding:2px;border-radius:9px;margin:2px 4px}
.field-shell input,.field-shell select{min-height:36px;max-width:140px;border:0;background:transparent;color:#222445;padding:2px 6px;font:inherit}
.field-shell input[type=text],.field-shell input[type=number]{width:82px}
.field-shell select option{color:#222445;background:#efedf9}
summary{cursor:pointer;padding:8px 10px;min-height:40px}
details .row{margin-top:9px}
.value-slider{display:grid;grid-template-columns:1fr auto;align-items:center;gap:3px 8px}
.value-slider input{grid-row:2;grid-column:1/-1;width:100%;margin:0;min-height:32px}
progress,.card input{accent-color:#6e63ad}
.card table{border-collapse:collapse;width:100%;margin-top:8px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #8984af}
.badge,.drop{padding:8px 12px;border-radius:10px}
.drop{border-style:dashed}.measure{padding:12px;display:grid;gap:10px}
button:disabled{opacity:.55;cursor:default}
dialog{border:0;background:transparent;color:#222445;max-width:min(480px,94vw);padding:0}
dialog::backdrop{background:#17192eb5}
dialog .card{padding:25px}
.dial{width:94px;min-height:102px;display:grid;place-items:center;padding:10px;position:relative}
.dial-face{width:54px;height:54px;border:2px solid #71649f;border-radius:50%;background:#d7d2ed;display:grid;place-items:center;transform:rotate(var(--dial-angle,-24deg))}
.dial-face::after{content:"";display:block;background:#71649f;width:3px;height:20px;transform:translateY(-10px);border-radius:3px}
.dial input{position:absolute;width:80px;height:66px;opacity:0;top:3px;left:5px;cursor:ew-resize}
.dial:focus-within{outline:3px solid #7164ce;outline-offset:3px}
.rail{flex:1;min-width:min(100%,165px)}
.divider{padding:11px 10px}.divider input{cursor:ew-resize}
.record-frame{padding:10px;margin:12px 0}.record-image{height:60px;border-radius:4px;background:radial-gradient(ellipse at 45% 72%,#9985b4 0 13%,#564a70 14% 22%,#292744 23%);margin-bottom:6px}
input[type=file]{max-width:100%}
.meta{color:var(--muted);font-size:15px;margin:20px 0}
.comparison{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.column{min-width:0}.column-heading{min-height:70px}.subtitle{font-size:15px;margin-top:4px}
.board{display:grid;align-content:start;gap:20px;padding:clamp(16px,3vw,44px);background:var(--sample);min-height:380px;border-radius:16px;color:var(--ink)}
.surface{position:relative;isolation:isolate;color:var(--ink);background:#bcbbea;border:solid #827bac;border-width:0 2px 2px 0;border-radius:16px}
.surface>.grain{display:block;position:absolute;inset:0;width:100%;height:100%;border-radius:inherit;overflow:hidden;z-index:-1;pointer-events:none;opacity:var(--strength)}
[data-method="png"] .surface{background-image:url("grain-08.png")}
[data-method="png"] .grain{display:none}
.card{display:grid;gap:12px;padding:26px;min-height:184px}
.card p{font-size:18px;line-height:1.55}.row{display:flex;gap:10px;flex-wrap:wrap}
.action,.option{font-size:17px;padding:8px 20px;min-height:44px;border-radius:25px}.action{background-color:#f3b7bf;border-color:#bd7b92;font-weight:600}.option{background-color:#e0def1;border-color:#9a91b7}.option[aria-pressed=true]{background-color:#a49eda;border-color:#71649f}
.tip{width:max-content;max-width:100%;background-color:#f6d5d0;border-color:#c5899b;border-radius:10px;padding:12px 16px;font-size:17px}
:focus-visible{outline:3px solid #7164ce;outline-offset:4px}
.defs{position:absolute;width:0;height:0;overflow:hidden}
@media(max-width:830px){.comparison{grid-template-columns:1fr}.settings{grid-template-columns:1fr 1fr}.reset{grid-column:1/-1;justify-self:start;padding:0 14px}}
.progress-variants{display:grid;gap:16px;min-width:0}
.progress-variant{display:grid;gap:6px;min-width:0}
.progress-variant > p{font-size:15px;font-weight:500}
.progress-variant .progress-face.surface{
  margin:0;padding:12px 14px;border-color:#505875;border-radius:8px;
  background-color:#222640;color:#f4f1ff;min-width:0;
}
.progress-line{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.progress-face strong{font-size:18px;font-weight:600}
.progress-index{color:#c1cbe4;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.progress-scale ol,.progress-index-list{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.progress-scale ol{padding:0;margin:10px 0 0}
.progress-scale li > span:last-child{
  position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;
}
.progress-scale .progress-tick{display:block;height:5px;background:#697395;border-radius:1px}
.progress-scale .done .progress-tick{background:#90c5bd}
.progress-scale [aria-current=step] .progress-tick{background:#ffe2ad;outline:1px solid #ffe2ad;outline-offset:2px}
.progress-index-list li{display:grid;gap:4px;align-content:start;color:#b9c4db;font-size:14px;overflow-wrap:anywhere}
.progress-index-list .progress-tick{height:2px;background:#68728c}
.progress-index-list .done .progress-tick{background:#90c5bd}
.progress-index-list [aria-current=step]{color:#ffe2ad;font-weight:600}
.progress-index-list [aria-current=step] .progress-tick{background:#ffe2ad;height:4px}
.progress-handoff{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap}
.progress-handoff .progress-line{justify-content:start}
.progress-handoff .progress-index{border-inline-end:1px solid #75809c;padding-inline-end:8px}
.progress-next{color:#c1cbe4;font-size:14px}
.progress-variant .progress-bookmark.surface{display:flex;align-items:center;gap:10px;padding-block:0;min-height:52px}
.progress-flag{align-self:stretch;display:grid;place-items:center;padding:0 10px;background:#ffe2ad;color:#282239;font-size:19px;font-weight:600;clip-path:polygon(0 0,100% 0,100% 100%,50% 85%,0 100%)}
.progress-preview-actions{margin-top:12px}
@media(forced-colors:active){
  .progress-scale .progress-tick,.progress-index-list .progress-tick{border-block-start:2px solid CanvasText}
  .progress-face [aria-current=step] .progress-tick{outline:2px solid Highlight}
}
.card .course-track.surface {
  --rail:#7d7aaf;
  border-radius:12px;
  background-color:#28294b;
  color:#bfc0dd;
  border-color:#55537b;
}
.course-rail {
  list-style:none;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:0;
  margin:0;
  padding:14px 6px 12px;
}
.course-rail li {
  position:relative;
  display:grid;
  justify-items:center;
  gap:8px;
  text-align:center;
  align-content:start;
  line-height:1.2;
  font-size:clamp(12px,1.5vw,16px);
}
.course-rail li:not(:last-child)::before {
  content:"";
  position:absolute;
  left:calc(50% + 17px);
  right:calc(-50% + 17px);
  top:14px;
  border-top:2px dashed var(--rail);
}
.course-rail li.done::before{border-top:2px solid #a8dfce}
.course-rail b {
  display:grid;
  place-items:center;
  width:30px;
  height:30px;
  border:1px solid currentColor;
  border-radius:50%;
  font-size:15px;
}
.course-rail .done{color:#b6e9d7}
.course-rail [aria-current=step]{color:#f2edff;font-weight:600}
.course-rail [aria-current=step] b{background:#cac2ff;border-color:#cac2ff;color:#252444;outline:2px solid #7b74bc;outline-offset:2px}
.card .record-entry.surface {
  display:inline-grid;
  grid-template-columns:42px auto 65px;
  justify-self:start;
  align-items:stretch;
  gap:0;
  min-height:58px;
  padding:0;
  background-color:#252847;
  color:#f9f4ed;
  border-color:#5d5880;
  border-radius:5px 12px 12px 5px;
  font-size:18px;
  text-align:start;
}
.record-entry .record-spine{display:grid;place-items:center;background:#3b3c66;border-right:1px solid #6e658d;border-radius:5px 0 0 5px;color:#e0d6fd}
.record-entry .record-label{align-self:center;padding:0 12px;white-space:nowrap}
.record-entry b{display:grid;place-items:center;font-size:24px;background:#efd0a4;color:#452f39;border-radius:0 10px 10px 0;font-variant-numeric:tabular-nums}
.card .record-entry.surface:hover,.card .record-entry.surface:focus-visible{background-color:#3b416c}
@media(max-width:390px){.card .record-entry.surface{grid-template-columns:36px auto 52px}.record-entry .record-label{padding:0 8px}}

@media(forced-colors:active){.grain{display:none!important}.surface{border:1px solid ButtonText;background-image:none!important}}
/* Inline value bars with native range input for pointer, touch and keyboard. */
.standalone-stepper .option.surface{
  inline-size:44px;block-size:44px;min-height:44px;padding:0;border-radius:50%;
  font-variant-numeric:tabular-nums;
}
.stepper-field.surface{
  display:inline-flex;align-items:center;min-height:44px;padding:0 9px;
  border-radius:8px;background-color:#eeebf9;font-variant-numeric:tabular-nums;
}
.stepper-field input{
  width:5ch;min-height:40px;padding:0;border:0;background:transparent;
  color:inherit;font:inherit;text-align:right;appearance:textfield;
}
.stepper-field input::-webkit-inner-spin-button{appearance:none}
.stepper-field:focus-within{outline:2px solid #6252a2;outline-offset:2px}
.longitude-stepper-row{display:flex;align-items:center;gap:6px}
.longitude-stepper-row .option.surface{flex:none;font-size:14px}
.longitude-stepper-row .stepper-field{flex:none}
.longitude-stepper-row .longitude-confirm.surface{
  display:grid;place-items:center;margin-inline-start:4px;
  background-color:#bde6d7;color:#173e39;border-color:#5c9a88;
}
.longitude-stepper-status{margin-top:8px;font-size:14px}
@media(max-width:420px){
  .card:has(.longitude-stepper){padding-inline:12px}
  .longitude-stepper-row{gap:3px}
  .longitude-stepper-row .option.surface{inline-size:32px;block-size:32px;min-height:32px;font-size:11px}
  .longitude-stepper-row .stepper-field{padding-inline:4px;min-height:32px;font-size:13px}
  .longitude-stepper-row input{width:4ch;min-height:32px}
}
.slider-bars{display:grid;gap:10px}
@media(max-width:400px){.card:has(.slider-with-stepper){padding-inline:12px}}
.slider-with-stepper{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:5px;
  container-type:inline-size;
}
.slider-step-side{display:grid;grid-template-columns:repeat(2,1fr);gap:1px}
.slider-step-side button.surface{
  min-width:44px;min-height:46px;padding:0 3px;border-radius:0;
  background-color:#e6e1f4;color:#26213f;border-color:#9c92ba;
  font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.slider-step-side button[data-speed=coarse]{background-color:#cec4ea;border-color:#8a79b4}
.slider-step-side button:first-child{border-radius:7px 0 0 7px}
.slider-step-side button:last-child{border-radius:0 7px 7px 0}
.slider-step-side button[aria-disabled=true]{opacity:.48;cursor:default}
.slider-step-side button[aria-disabled=false]:active{filter:brightness(.9)}
@container (max-width:360px){
  .slider-step-side button.surface{font-size:13px}
  .slider-with-stepper .slider-bar{padding-inline:5px;gap:4px;font-size:13px}
}
@container (max-width:275px){
  .slider-step-side button.surface{min-width:35px;padding-inline:1px;font-size:12px}
  .slider-with-stepper .slider-bar{grid-template-columns:minmax(0,1fr);gap:0;text-align:center}
}
.slider-bar{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;min-height:46px;padding:0 13px;gap:12px;background:#222640;color:#f5f0ff;isolation:isolate;overflow:hidden;border:1px solid #566084;border-radius:8px;font-size:16px}
.slider-bar .slider-fill.surface{position:absolute;inset:0 auto 0 0;width:var(--slider-fill,0%);z-index:-1;pointer-events:none;background-color:#524b84;color:inherit;border:solid #a99de3;border-width:0 1px 2px 0;border-radius:7px}
.slider-bar[data-tone=warm] .slider-fill.surface{background-color:#7a4963;border-color:#d4a0b0}
.slider-bar[data-tone=cool] .slider-fill.surface{background-color:#32566d;border-color:#98b9d4}
.slider-bar:focus-within{outline:3px solid #8172c3;outline-offset:3px}
.slider-bar:active .slider-fill.surface{filter:brightness(1.19)}
.slider-bar:has(input:disabled){opacity:.6}
.slider-bar output{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none}
.slider-bar input[type=range]{appearance:none;position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0;touch-action:pan-y}
.slider-bar input:disabled{cursor:default}
.slider-bar input::-webkit-slider-thumb{appearance:none;width:1px;height:40px}
.slider-bar input::-moz-range-thumb{width:1px;height:40px;border:0}
.slider-bar .slider-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
@media(forced-colors:active){.slider-bar{color:CanvasText;background:Canvas}.slider-bar .slider-fill.surface{background:Highlight;opacity:.45}.slider-bar:focus-within{outline-color:Highlight}}

/* An equal-width radio group rendered as a single control. */
.step-field{min-width:0;margin:0;padding:0;border:0}
.step-field legend{padding:0 0 6px;font-size:15px}
.step-bar{
  display:grid;grid-template-columns:repeat(var(--steps),minmax(0,1fr));isolation:isolate;
  border:1px solid #5d6488;border-radius:9px;background:#222640;color:#e4e0f8;
}
.step-segment{
  position:relative;isolation:isolate;display:grid;place-items:center;min-width:0;min-height:44px;
  border-radius:6px;border-inline-end:1px solid #53597d;font-size:15px;cursor:pointer;
}
.step-segment:last-child{border-inline-end:0}
.step-segment input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.step-segment:focus-within{outline:2px solid #e9dfff;outline-offset:-3px}
.step-segment .step-label{z-index:1;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.step-segment .step-fill.surface{
  display:none;position:absolute;inset:2px 2px 2px 1px;z-index:-1;
  pointer-events:none;border-radius:5px;background-color:#665990;border-color:#b4a4e4;
}
.step-segment:has(input:checked) .step-fill{display:block}
.step-segment:has(input:checked){color:#fff;font-weight:600}
.step-segment:not(:has(input:checked)):hover{background:#2e3252}
@media(forced-colors:active){.step-segment:has(input:checked){color:HighlightText;background:Highlight}.step-segment .step-fill.surface{display:none}}

/* Anchored tips and their disclosure use the same material controls as the specimens. */
.knowledge-case + .knowledge-case{margin-top:12px}
.knowledge-scene{
  --edge:12px;--trigger:48px;--tip-offset:calc(var(--edge) + var(--trigger) + 10px);
  background:#282947;border:1px solid #746a9c;border-radius:12px;
}
.knowledge-disclosure{position:relative;min-height:185px;min-width:0}
.knowledge-disclosure .knowledge-trigger.surface{
  position:absolute;display:grid;place-items:center;
  width:var(--trigger);height:var(--trigger);padding:0;
  list-style:none;background-color:#bde6d7;color:#173e39;
  border-color:#5c9a88;border-radius:50%;
}
.knowledge-trigger::-webkit-details-marker{display:none}
.knowledge-trigger svg{width:25px;height:25px}
.knowledge-disclosure[open] .knowledge-trigger.surface{background-color:#d9f6eb}
.knowledge-disclosure .knowledge-tip.surface{
  position:absolute;width:min(290px,calc(100% - 2 * var(--edge)));
  padding:5px 10px 10px;background-color:#e5f4ed;color:#1b3735;
  border-color:#84ab9d;border-radius:10px;
}
.knowledge-tip::before{
  content:"";position:absolute;width:8px;height:8px;background:#e5f4ed;
  transform:rotate(45deg);pointer-events:none;
}
:is(.knowledge-scene--up,.knowledge-scene--down) :is(.knowledge-trigger,.knowledge-tip){
  left:50%;translate:-50% 0;
}
.knowledge-scene--up .knowledge-trigger{bottom:var(--edge)}
.knowledge-scene--up .knowledge-tip{bottom:var(--tip-offset)}
.knowledge-scene--up .knowledge-tip::before{bottom:-4px;left:calc(50% - 4px)}
.knowledge-scene--down .knowledge-trigger{top:var(--edge)}
.knowledge-scene--down .knowledge-tip{top:var(--tip-offset)}
.knowledge-scene--down .knowledge-tip::before{top:-4px;left:calc(50% - 4px)}
:is(.knowledge-scene--left,.knowledge-scene--right) :is(.knowledge-trigger,.knowledge-tip){
  top:50%;translate:0 -50%;
}
:is(.knowledge-scene--left,.knowledge-scene--right) .knowledge-disclosure .knowledge-tip.surface{
  width:min(290px,calc(100% - var(--tip-offset) - var(--edge)));
}
.knowledge-scene--left .knowledge-trigger{right:var(--edge)}
.knowledge-scene--left .knowledge-tip{right:var(--tip-offset)}
.knowledge-scene--left .knowledge-tip::before{right:-4px;top:calc(50% - 4px)}
.knowledge-scene--right .knowledge-trigger{left:var(--edge)}
.knowledge-scene--right .knowledge-tip{left:var(--tip-offset)}
.knowledge-scene--right .knowledge-tip::before{left:-4px;top:calc(50% - 4px)}
@media(max-width:400px){
  .card:has(.knowledge-case){padding-inline:12px}
  .knowledge-scene{--edge:8px}
  .knowledge-disclosure{min-height:250px}
}
.knowledge-title{display:flex;justify-content:space-between;align-items:center;gap:4px}
.knowledge-title h4{margin:0;font-size:18px;font-weight:600}
.knowledge-tip p{font-size:16px;line-height:1.55}
.knowledge-close{
  flex:none;min-width:44px;min-height:44px;padding:0;border:0;border-radius:8px;
  background:transparent;color:inherit;font:inherit;font-size:22px;
}
.knowledge-close:active{background:#c4dfd4}
.knowledge-disclosure :is(summary,button):focus-visible{outline:2px solid #197c67;outline-offset:2px}
@media(forced-colors:active){.knowledge-tip::before{display:none}}
.tip-case + .tip-case{margin-top:12px}
.tip-placement{margin-bottom:6px;font-size:15px;font-weight:500}
.tip-scene{
  display:grid;gap:9px;justify-content:center;justify-items:center;
  align-items:start;padding:16px 12px;border:1px solid #746a9c;
  border-radius:12px;background:#282947;color:#f5efff;
}
.tip-scene--left{grid-template-columns:minmax(0,max-content) 30px}
.tip-scene--right{grid-template-columns:30px minmax(0,max-content)}
.tip-scene--above,.tip-scene--left{grid-auto-flow:dense}
.tip-pin{
  display:grid;place-items:center;width:30px;height:30px;
  border:1px solid #bbb0ee;border-radius:50%;background:#46436e;color:#f0eaff;
  font-size:14px;font-weight:600;line-height:1;
}
.tip-scene--above .tip-pin{grid-row:2}
.tip-scene--left .tip-pin{grid-column:2}
.tip-scene--left .tip-pin,.tip-scene--right .tip-pin{margin-top:8px}
.tip-scene .bubble-copy.surface{
  --bubble:#f2cbc9;position:relative;width:max-content;max-width:100%;
  padding:11px 14px;background-color:var(--bubble);border-color:#bd8192;
  border-radius:8px;color:#482b48;font-size:16px;line-height:1.45;
}
.bubble-copy::before{
  content:"";position:absolute;width:8px;height:8px;
  background:var(--bubble);transform:rotate(45deg);pointer-events:none;
}
.tip-scene--above .bubble-copy::before{left:calc(50% - 4px);bottom:-4px}
.tip-scene--below .bubble-copy::before{left:calc(50% - 4px);top:-4px}
.tip-scene--left .bubble-copy::before{right:-4px;top:calc(50% - 4px)}
.tip-scene--right .bubble-copy::before{left:-4px;top:calc(50% - 4px)}
.bubble-details{min-width:0;max-width:100%}
.tip-scene--above .bubble-details[open]{display:flex;flex-direction:column-reverse}
.tip-scene--above .bubble-details[open] .bubble-panel{margin:0 0 7px}
.tip-scene--above .bubble-details summary,.tip-scene--below .bubble-details summary{margin-inline:auto}
.tip-scene--left .bubble-details summary{margin-inline-start:auto}
.bubble-details summary{
  list-style:none;display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;
}
.bubble-details summary::-webkit-details-marker{display:none}
.bubble-details summary .bubble-chevron{
  display:inline-block;flex:none;width:8px;height:8px;border-right:2px solid currentColor;
  border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);
}
.bubble-details[open] summary .bubble-chevron{transform:rotate(225deg) translate(-1px,-1px)}
.tip-scene .bubble-panel.surface{
  margin-top:7px;display:grid;gap:12px;min-width:0;padding:16px;
  background-color:#e3def5;color:#242443;border-color:#a39ac3;border-radius:10px;
}
.bubble-panel .bubble-heading{font-size:16px;font-weight:500}
.bubble-panel dl{
  display:grid;grid-template-columns:1fr auto;gap:0 8px;margin:0;font-size:15px;
}
.bubble-panel dt,.bubble-panel dd{margin:0;padding:7px 0;border-top:1px solid #b9b0d2}
.bubble-panel dd{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.bubble-panel .bubble-feedback{min-height:1.5em;font-size:14px;color:#51466c}
.bubble-panel .row{gap:8px}
.bubble-panel .row button{font-size:15px;padding-inline:13px}
@media(max-width:400px){.tip-scene{padding:12px 9px;gap:9px}.bubble-panel dl{font-size:14px}.tip-scene .bubble-panel.surface{padding:12px}}
@media(forced-colors:active){.bubble-copy::before{display:none}}

</style>

  <section class="column" data-method="png"><div class="column-heading"><h2>当前静态纹理</h2><p class="subtitle">共享 128 × 128 PNG</p></div><div class="board"></div></section>
 </div>
