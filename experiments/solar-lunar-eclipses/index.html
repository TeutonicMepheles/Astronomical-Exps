<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>日月食原理演示</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="../../shared/typography/typography.css"><link rel="stylesheet" href="overview.css?v=ground-window-20261120"><link rel="stylesheet" href="components/eclipse-timeline.css">
<link rel="stylesheet" href="typography.css?v=observer-controls-20261117-12">
</head><body><main id="stage" data-view="overview" aria-label="日月食原理演示">
<canvas id="scene" role="img" aria-label="日地月公转示意：蓝灰色黄道面与金色倾斜月球轨道相交；天体大小和距离经过教学调整"></canvas>
<h1 id="experimentTitle">日月食原理演示</h1>
<div id="overviewCameras"><button id="splitCameraToggle" aria-pressed="false" aria-controls="scene splitViewLabels" aria-label="并排查看平视与垂直黄道面" title="双视角对照"><svg viewBox="0 0 36 32" width="36" height="32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="31" height="25" rx="3"/><path d="M18 4v24M6 20h8M6 17l4-2 4 2"/><ellipse cx="25.5" cy="16" rx="4.8" ry="6.4"/><circle cx="25.5" cy="16" r="1.2"/></svg></button></div>
<div id="splitDivider" hidden role="separator" tabindex="0" aria-label="调整双视图宽度，左右方向键调节，回车均分" aria-orientation="vertical" aria-valuemin="30" aria-valuemax="70" aria-valuenow="50"><span aria-hidden="true"></span></div>
<div id="splitViewLabels" hidden aria-hidden="true"><span>平视黄道面</span><span>垂直黄道面</span></div>
<button id="back" hidden>← 返回公转总览</button><h2 id="viewTitle" hidden>地月观测</h2>
<button id="surfaceZoom" hidden aria-pressed="false" aria-controls="surfaceDetail">受影面放大</button>
<div id="sweepLegend" aria-label="整个过程的月影扫掠范围"><span class="sweep-central">全食／环食经过</span><span class="sweep-partial">偏食经过</span></div>
<div id="observationSummary" hidden><div><span>全程结果</span><output id="eventOutcome"></output></div><div><span>当前状态</span><output id="currentObservation"></output></div></div>
<div id="shadowLegend" hidden aria-label="当前影斑边界"><span class="current-shadow-label">当前影斑</span><span class="umbra-key">本影边界</span><span class="penumbra-key">半影边界</span><span class="antumbra-key" hidden>伪本影边界</span></div>
<section id="surfaceDetail" hidden role="region" aria-label="受影面放大观察"><div class="surface-header"><strong id="surfaceTitle">地球受影面</strong><div><button id="surfaceClose">关闭</button></div></div><canvas id="surfaceCanvas" role="img" aria-label="受影球面本影和半影分布"></canvas><div class="surface-legend"><span class="umbra-key">本影边界</span><span class="penumbra-key">半影边界</span><span class="antumbra-key" hidden>伪本影边界</span></div></section>
<nav id="observationModes" aria-label="观察类别"><button id="solarCategory" data-category="solar" aria-pressed="true" aria-controls="eventTypes"><img class="observation-mode-icon" src="assets/ui/solar-eclipse-toggle.png" width="40" height="40" alt="" aria-hidden="true"><span>日食观察</span></button><button data-category="lunar" data-event="lunar" aria-pressed="false"><img class="observation-mode-icon" src="assets/ui/lunar-eclipse-toggle.png" width="40" height="40" alt="" aria-hidden="true"><span>月食观察</span></button></nav>
<nav id="eventTypes" aria-label="日食事件"><button data-event="total">全食事件</button><button data-event="annular">环食事件</button></nav>
<div id="observerCandidates" role="group" aria-label="地球受影面候选观测点"></div>
<button id="sweepToggle" type="button" aria-label="隐藏全程扫掠色带" title="隐藏全程扫掠色带" aria-pressed="true" aria-controls="scene sweepLegend"><span>显示月影扫掠区域</span><span class="sweep-switch" aria-hidden="true"></span></button>
<div id="observationCameras" role="group" aria-label="观察视角"><button id="observationSolar" aria-label="日食观察" title="日食观察" aria-pressed="false" aria-controls="scene"><img class="camera-view-icon" src="assets/selected-icons/camera-solar.svg?v=sun-earth-moon-20261118" width="40" height="40" alt="" aria-hidden="true"></button><button id="observationOblique" aria-label="侧视" title="侧视" aria-pressed="true" aria-controls="scene"><img class="camera-view-icon" src="assets/selected-icons/camera-oblique.svg?v=sun-earth-moon-20261118" width="40" height="40" alt="" aria-hidden="true"></button><button id="observationSide" aria-label="正视" title="正视" aria-pressed="false" aria-controls="scene"><img class="camera-view-icon" src="assets/selected-icons/camera-front.svg?v=sun-earth-moon-20261118" width="40" height="40" alt="" aria-hidden="true"></button></div>
<div id="observationTools" hidden>
<div class="observation-transport" role="group" aria-label="食相播放控制"><button id="continuousPlay" aria-label="播放" title="播放"><svg viewBox="0 0 32 32" aria-hidden="true"><path class="transport-play" d="M11 6l15 10-15 10Z" fill="currentColor" stroke="none"/><path class="transport-pause" d="M11 7v18M22 7v18" stroke-width="4"/></svg></button><button id="restartEvent" aria-label="重播" title="重播"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 11a11 11 0 1 1-1 11M7 4v8h8"/></svg></button></div>
<details id="observationOptions"><summary>观测调节</summary><div class="observation-options-body">
<div role="group" aria-label="选择食象"><button data-observation-mode="solar" aria-pressed="true">日食</button><button data-observation-mode="lunar" aria-pressed="false">月食</button></div>
<label for="referenceCase">典型场景（示意） <select id="referenceCase"><option value="free">自由观测</option><option value="total">全食事件</option><option value="annular">环食事件</option></select></label>
<label for="observationYear">地球公转 <output id="observationYearValue"></output></label><input id="observationYear" type="range" min="0" max="360" step="0.1" value="0">
<div><button id="locateSyzygy">定位新月／满月</button></div>
<div><button id="annualPlay" aria-pressed="false">年度对比（定相位）</button><button id="zoomShadow" aria-pressed="false">放大影区</button><button id="fitOrbit">轨道全景</button></div>
<output id="observationGeometry"></output><output id="observerCoordinates" aria-label="观察点 A 固定模型经纬度"></output>
</div></details></div>
<aside id="eventTip" hidden aria-live="polite"><span id="eventText"></span><button id="enter">进入地月观测 →</button></aside>
<section id="observer" hidden aria-label="观察点 A 地面视角"><h2 class="observer-title"><span>地面视角</span><span id="observerLabel" class="observer-site-tag">观察点 A</span></h2><canvas id="sky" role="img" aria-label="观察点 A 看到的日月食"></canvas><div class="observer-caption"><span id="solarPhotoLabel" hidden>实拍示意</span><output id="phaseName"></output></div></section>
    <div id="observerPrompt" hidden>选择观测点</div>
    <nav class="rail" id="stageRail" hidden aria-label="食相阶段">
      <svg class="rail-cv" viewBox="0 0 1600 900" aria-hidden="true">
        <defs>
          <linearGradient id="railTrailFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f6d49a" stop-opacity="0"/>
            <stop offset="1" stop-color="#f6d49a" stop-opacity="0.5"/>
          </linearGradient>
        </defs>
        <path class="rail-base" fill="none"/>
        <path class="rail-read" fill="none"/>
        <path class="rail-trail" fill="none" stroke="url(#railTrailFade)"/>
        <g class="rail-ticks"></g>
        <circle class="rail-end" r="2.5"/>
      </svg>
      <div class="rail-head">
        <span class="rail-head-label" id="railScope">月食</span>
        <span class="rail-pct" id="railPct" role="status" aria-live="polite">0%</span>
        <span class="rail-sub" id="railSub">月面边缘刚接触日面</span>
        <span class="rail-rest" id="railRest">剩 <b>4</b> 步</span>
      </div>
      <div class="rail-list" id="railList"></div>
      <div class="rail-glow" aria-hidden="true"><span class="halo"></span><span class="core"></span></div>
    </nav>
<section class="progress" aria-label="公转调节">
<div id="dateRow" class="progress-row"><label for="date">日期 <output id="dateValue"></output></label><input id="date" type="range" min="0" max="364" step="1" value="0" aria-description="统一加速时间轴：现实2秒对应模拟1天；日期调节同步地月运动，非真实食象预报"></div>
<div class="progress-row"><label for="moon">月球公转 <output id="moonValue"></output></label><input id="moon" type="range" min="0" max="360" step="0.1" value="135" aria-label="月球公转进度"><button id="play" aria-label="暂停地月运动" aria-pressed="true">Ⅱ</button></div>
</section><p id="status" class="sr-only" aria-live="polite"></p>
</main><script src="vendor/three.min.js"></script><script src="../../shared/components/optical-beam.js"></script><script src="js/eclipse-model.js"></script><script src="js/sky-window.js?v=partial-photo-20261120"></script><script src="js/stage-rail.js?v=lunar-icons-20261120"></script><script type="module" src="js/overview.js?v=observer-clearance-20261120"></script></body></html>
