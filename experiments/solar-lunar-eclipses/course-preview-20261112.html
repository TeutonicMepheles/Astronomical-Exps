<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日月食原理演示</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../shared/typography/typography.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" aria-label="日月食原理演示">
    <canvas id="scene" aria-hidden="true"></canvas>
    <nav class="course-nav" aria-label="实验流程">
      <button data-chapter="0">01 轨道与条件</button><button data-chapter="1">02 本影与半影</button><button data-chapter="2">03 日食过程</button><button data-chapter="3">04 月食过程</button><button data-chapter="4">05 条件回顾</button>
    </nav>
    <div class="node-comparison" role="group" aria-label="交点位置对比"><button id="nodeAligned" aria-pressed="true">交点对齐</button><button id="nodeMiss" aria-pressed="false">交点错开</button><button id="syzygyBtn">定位新月／满月</button><button id="overviewBtn" aria-pressed="false">轨道全景</button><button id="yearPlay" aria-pressed="false">年度对比（定相位）</button><output id="nodeStatus"></output></div>
    <section class="lesson"><h1 id="lessonTitle"></h1><p id="lessonText"></p></section>
    <section class="orbit-controls" aria-label="完整公转调节">
      <label>月球公转 <output id="orbitValue">0°</output><input id="orbitRange" aria-label="月球完整公转角度" type="range" min="0" max="360" value="180"></label>
      <label>地球公转 <output id="yearValue">0°</output><input id="yearRange" aria-label="地球完整公转角度" type="range" min="0" max="360" step="0.1" value="0"></label>
      <div><button id="alignedBtn">交点对齐</button><button id="missBtn">交点错开</button><button id="orbitPlay">播放一周</button></div>
      <p id="orbitStatus" aria-live="polite"></p>
    </section>
    <div class="year-scrub" role="group" aria-label="地球完整一年公转调节"><label for="earthYearRange">地球公转 <output id="earthYearValue">0.0°</output></label><input id="earthYearRange" type="range" min="0" max="360" step="0.1" value="0" aria-label="地球一年公转进度"></div>
    <div class="shadow-key"><span>● 本影：直射阳光完全被挡</span><span>◐ 半影：仍有部分直射阳光</span></div>
    <div class="course-actions"><button id="courseBack">上一章</button><button id="courseNext">进入本影与半影 →</button></div>
    <div class="extra-controls"><button id="restartBtn">重播</button><label>速度 <select id="speed" aria-label="播放速度"><option value="1">×1</option><option value="5">×5</option><option value="10">×10</option></select></label><button id="zoomBtn" aria-pressed="false">放大影区</button></div>

    <div class="mode-switch" role="group" aria-label="选择食象">
      <button type="button" data-mode="solar" aria-pressed="true">日食</button>
      <button type="button" data-mode="lunar" aria-pressed="false">月食</button>
    </div>

    <div class="view-switch" role="group" aria-label="选择视角">
      <button type="button" data-view="earth" aria-pressed="true">地月</button>
      <button type="button" data-view="system" aria-pressed="false">日地月</button>
      <button type="button" data-view="side" aria-pressed="false">侧视</button>
      <button type="button" data-view="oblique" aria-pressed="false">斜视</button>
    </div>

    <section class="observer-card" aria-label="地面观察与当前阶段">
      <div class="sky-frame">
        <canvas id="sky" role="img" aria-label="地面观察视角"></canvas>
        <span class="sky-caption" aria-hidden="true">地面观察 · <b class="observer-key">● 观察点 A</b></span>
      </div>
      <div class="stage-line">
        <span class="stage-name" id="stageName">初亏</span>
        <span class="stage-type" id="stageType">日全食</span>
      </div>
      <div class="stage-track" aria-hidden="true"><i id="stageFill"></i></div>
    </section>

    <div class="scrub" role="group" aria-label="月球公转进度">
      <span class="scrub-label" aria-hidden="true">公转一周 <output id="phiValue">0°</output></span>
      <div class="scrub-track">
        <input id="phiRange" type="range" min="0" max="1000" step="0.1" value="0"
               aria-label="月球绕地球公转进度，拖动可停在任意时刻" aria-valuetext="">
        <div class="scrub-ticks" id="phiTicks" aria-hidden="true"></div>
      </div>
    </div>

    <nav class="rail" id="stageRail" aria-label="食相阶段">
      <svg class="rail-cv" viewBox="0 0 1600 900" aria-hidden="true">
        <defs>
          <linearGradient id="railTrailFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f6d49a" stop-opacity="0"/>
            <stop offset="1" stop-color="#f6d49a" stop-opacity="0.5"/>
          </linearGradient>
        </defs>
        <path class="rail-base" fill="none"/>
        <path class="rail-read" fill="none"/>
        <path class="rail-trail" fill="none" stroke="url(#railTrailFade)"/>
        <g class="rail-ticks"></g>
        <circle class="rail-end" r="2.5"/>
      </svg>
      <div class="rail-head" aria-hidden="true">
        <span class="rail-head-label">食相</span>
        <span class="rail-pct" id="railPct">0%</span>
        <span class="rail-sub" id="railSub">月面边缘刚接触日面</span>
        <span class="rail-rest" id="railRest">剩 <b>4</b> 步</span>
      </div>
      <div class="rail-list" id="railList"></div>
      <div class="rail-glow" aria-hidden="true"><span class="halo"></span><span class="core"></span></div>
    </nav>

    <div class="transport" role="group" aria-label="播放控制">
      <button type="button" id="prevBtn" aria-label="上一步">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <button type="button" id="playBtn" class="transport-main" aria-label="播放">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5 19 12 8.5 18.5Z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="5.5" width="2.6" height="13" rx="1"/><rect x="13.4" y="5.5" width="2.6" height="13" rx="1"/></svg>
      </button>
      <button type="button" id="nextBtn" aria-label="下一步">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <p class="live" id="live" aria-live="polite"></p>
  </main>

  <!-- 星体材质：复用 shared/components/globe-shader-renderer，模块脚本自行挂到 window -->
  <script type="module" src="js/planet-materials.js"></script>
  <script src="js/eclipse-model.js"></script>
  <script src="js/eclipse-scene.js"></script>
  <script src="js/sky-window.js"></script>
  <script src="js/stage-rail.js"></script>
  <script src="js/course-orbit.js"></script>
  <script src="js/orbit-plane-view.js"></script>
  <script src="js/solar-surface-view.js"></script>
  <script src="js/lunar-shadow-view.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
