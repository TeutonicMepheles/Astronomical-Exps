<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>光污染实验</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../shared/components/components.css">
  <link rel="stylesheet" href="lamps.css">
  <script src="../../shared/components/affordance.js" defer></script>
  <script src="../../shared/components/hand-icons-flat.js" defer></script>
  <script src="../../shared/components/gesture.js" defer></script>
  <script src="lamp-layout.js" defer></script>
  <script src="lamps.js" defer></script>
  <script src="app.js" defer></script>
  <script src="lamp-hints.js" defer></script>
<link rel="stylesheet" href="../../shared/typography/typography.css"></head>
<body>
  <main class="stage" aria-label="光污染实验横向街景">
    <div class="viewport" tabindex="0" role="region" aria-label="横向街景，可拖动、滚轮或使用左右方向键移动">
      <div class="world">
        <canvas class="sky" width="2172" height="724" aria-hidden="true"></canvas>
        <img class="panorama" src="assets/city-layer-all-lamps.png" alt="连续的住宅、公共建筑、广告牌与滨河路灯夜景" draggable="false">
        <canvas class="lighting" width="2172" height="724" aria-hidden="true"></canvas>
        <div class="lamps"></div>
      </div>
    </div>
    <header><h1>光污染实验</h1><div class="rule"></div></header>
    <section class="lamp-editor" aria-label="前景路灯编辑" hidden>
      <div class="editor-heading"><h2>全部路灯 <small class="lamp-count"></small></h2><button class="close-editor" aria-label="关闭路灯编辑">×</button></div>
      <div class="shade-options" role="group" aria-label="灯罩样式">
        <button data-shade="open" aria-pressed="false"><svg viewBox="0 0 60 52" aria-hidden="true"><path d="M30 36v13" stroke="currentColor" stroke-width="3"/><circle cx="30" cy="22" r="15" fill="#ddd9c9"/></svg><span>无遮光</span></button>
        <button data-shade="half" aria-pressed="true"><svg viewBox="0 0 60 52" aria-hidden="true"><path d="M30 36v13" stroke="currentColor" stroke-width="3"/><circle cx="30" cy="23" r="13" fill="#ddd9c9"/><path d="M11 23a19 19 0 0 1 38 0Z" fill="#617391"/></svg><span>半遮光</span></button>
        <button data-shade="full" aria-pressed="false"><svg viewBox="0 0 60 52" aria-hidden="true"><path d="M15 49V14h19" fill="none" stroke="currentColor" stroke-width="3"/><path d="M22 15h27v9H22Z" fill="#617391"/><ellipse cx="35" cy="24" rx="13" ry="3" fill="#ddd9c9"/></svg><span>全遮光</span></button>
      </div>
      <label class="temperature-label" for="temperature">色温 <output id="temperature-value">3000 K</output></label>
      <input id="temperature" type="range" min="2200" max="6500" step="100" value="3000">
    </section>
    <button class="arrow previous" aria-label="向左移动">‹</button>
    <button class="arrow next" aria-label="向右移动">›</button>
    <footer>
      <span class="hint">拖动探索 <span>↔</span></span>
      <input class="position" type="range" min="0" max="1000" value="0" aria-label="街景位置">
      <span class="location" aria-hidden="true">住宅 · 公共建筑</span>
    </footer>
    <p class="error" hidden>场景图片未能加载，请确认 assets 文件夹完整。</p>
  </main>
</body>
</html>
