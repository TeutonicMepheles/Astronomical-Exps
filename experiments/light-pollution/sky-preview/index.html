<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动态星空组件预览</title><link rel="stylesheet" href="../../../shared/typography/typography.css"><link rel="stylesheet" href="preview.css">
<main id="stage"><canvas id="sky" aria-label="动态星空背景"></canvas>
<section id="settings" aria-label="星空调节" hidden><header><strong>星空调节</strong><button id="close" aria-label="收起调节面板">×</button></header>
<div class="levels" role="group" aria-label="天空档位"><button data-level="0">通透</button><button data-level="1">轻度</button><button data-level="2">明显</button><button data-level="3">强光</button></div>
<label>星星数量 <output id="count-value"></output><input id="count" type="range" min="0" max="6000" step="100"></label>
<label>星星密度 <output id="density-value"></output><input id="density" type="range" min="0.25" max="1.5" step="0.05"></label>
<label>闪烁强度 <output id="twinkle-value"></output><input id="twinkle" type="range" min="0" max="1" step="0.01"></label>
<label>旋转速度 <output id="speed-value"></output><input id="speed" type="range" min="0" max="5" step="0.1"></label>
<div class="colors"><label>天顶颜色<input id="topColor" type="color"></label><label>地平线颜色<input id="bottomColor" type="color"></label><label>星光颜色<input id="starColor" type="color"></label></div>
<button id="save">保存当前档位</button><p id="save-status" role="status" aria-live="polite"></p>
<div class="actions"><button id="pause" aria-pressed="false">暂停动态</button><button id="reset">本档恢复默认</button></div></section>
<button id="toggle" aria-label="打开星空调节" aria-controls="settings" aria-expanded="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="currentColor"/><circle cx="15" cy="17" r="3" fill="currentColor"/></svg></button></main>
<script src="../components/pollution-starfield/starfield.js"></script><script src="preview.js"></script></html>
