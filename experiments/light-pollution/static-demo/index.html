<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光污染 · 静态合成校对</title><link rel="stylesheet" href="../../../shared/typography/typography.css"><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body>
<main class="stage"><header><div><p class="eyebrow">LIGHT POLLUTION / STATIC STUDY</p><h1>先让画面完整地拼在一起</h1><p class="subtitle">原位分层 · 统一比例 · 保留原色</p></div><div class="status"><span class="dot"></span><strong id="status">正在加载</strong><small id="measurement">静态合成校对</small></div></header>
<section class="toolbar" aria-label="画面对照"><div class="segmented" aria-label="显示模式"><button data-mode="composite" aria-pressed="true">分层合成</button><button data-mode="reference" aria-pressed="false">原图参考</button><button data-mode="difference" aria-pressed="false">查看差异</button></div><div class="views" aria-label="观察区域"><button data-view="all" aria-pressed="true">全景</button><button data-view="homes" aria-pressed="false">住宅细节</button><button data-view="public" aria-pressed="false">公共建筑</button><button data-view="water" aria-pressed="false">滨河区域</button></div></section>
<section class="viewer" aria-label="静态拼接画面"><canvas id="scene" width="2171" height="724" aria-label="原位合成的光污染城市全景"></canvas><span id="view-label">分层合成 / 全景</span><div id="loading" role="status">正在加载静态图层…</div></section>
<section class="layer-controls" aria-label="静态图层"><div class="layer-heading"><h2>图层检查</h2><button id="restore">全部显示</button></div><div id="layers"></div></section>
<footer><span>所有内容共用同一画布与缩放比例</span><span>暂不加入动画与调光</span></footer></main></body></html>
