<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>光污染 · 遮罩画室</title>
<link rel="stylesheet" href="../../../../shared/typography/typography.css"><link rel="stylesheet" href="style.css">
<script src="assets-data.js" defer></script><script src="lighting.js" defer></script><script src="editor.js" defer></script></head>
<body><main class="stage">
<header><div><p class="eyebrow">LIGHT POLLUTION / MATERIAL LAB</p><h1>遮罩画室</h1></div><p>绘制受光范围，查看冷暖与明暗。<br>白色完全参与调光 · 黑色保留原图 · 灰色渐变过渡</p><span class="badge">独立预览</span></header>
<section class="workspace">
<aside><label for="asset">当前素材</label><select id="asset" disabled></select><p id="dimensions"></p>
<div class="buttons"><button id="source-import">导入原图</button><button id="mask-import">导入遮罩</button><button id="source-export">导出原图</button><button id="mask-export">导出遮罩</button></div>
<input id="source-file" type="file" accept="image/png,image/jpeg,image/webp" hidden><input id="mask-file" type="file" accept="image/png" hidden>
<hr><h2>画笔</h2><div class="buttons"><button id="paint" aria-pressed="true">绘制</button><button id="pan" aria-pressed="false">移动视图</button></div>
<label>灰度 <output id="gray-value">255</output><input id="gray" type="range" min="0" max="255" value="255"></label>
<div class="buttons swatches"><button data-gray="0">黑色</button><button data-gray="128">灰色</button><button data-gray="255" aria-pressed="true">白色</button></div>
<label>直径 <output id="size-value">24 px</output><input id="size" type="range" min="1" max="200" value="24"></label>
<label>柔边 <output id="soft-value">50%</output><input id="soft" type="range" min="0" max="100" value="50"></label>
<label>强度 <output id="strength-value">100%</output><input id="strength" type="range" min="1" max="100" value="100"></label>
<div class="buttons"><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><button id="auto">重新生成</button><button id="restore">恢复初始</button></div>
<p class="hint">在左侧画布拖动绘制。放大后切换“移动视图”拖动；两侧视图保持同步。</p>
</aside>
<div class="canvases"><div class="viewbar"><div class="tabs"><button data-view="overlay" aria-pressed="true">叠加</button><button data-view="mask">灰度遮罩</button><button data-view="source">原图</button></div><div class="zoom"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-value">1×</output><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适配</button><button id="full">全图</button></div></div>
<div class="frames"><section class="frame"><h2>01 <span>遮罩编辑</span><small id="view-label">青色表示参与调光范围</small></h2><canvas id="edit" aria-label="遮罩绘制画布"></canvas></section><section class="frame"><h2>02 <span>光照预览</span><button id="compare" aria-pressed="false">对比原图</button></h2><canvas id="preview" aria-label="调光效果预览"></canvas></section></div>
<div class="lighting"><label>亮度 <output id="brightness-value">100%</output><input id="brightness" type="range" min="0" max="200" value="100"></label><label>色温 <output id="temperature-value">3000 K</output><input id="temperature" type="range" min="2200" max="6500" step="100" value="3000"></label><div class="presets"><button data-light="0,3000">最低亮度</button><button data-light="100,3000">原始光照</button><button data-light="100,6500">冷白光</button></div></div>
<p class="note">预览使用现有建筑调光算法；不叠加广告 Bloom、天空与水面反光。亮度为视觉演示值。</p></div>
</section><footer><span id="status" role="status">正在加载素材…</span><span>修改仅保留在本页会话；离开前导出 PNG。</span></footer>
</main></body></html>
