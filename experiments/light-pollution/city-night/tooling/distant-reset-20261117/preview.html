<!doctype html><meta charset="utf-8"><title>远景窗孔独立核对</title><style>body{margin:24px;background:#101a2b;color:#eef3fa;font:18px system-ui}button,input{font:inherit}button{padding:10px 18px;margin:0 8px 12px 0}label{display:block;margin:12px 0}main{display:flex;gap:24px}figure{margin:0}canvas{height:65vh;max-width:46vw;object-fit:contain;image-rendering:auto}figcaption{margin:10px 0}</style><button data-view="all">背景全景</button><button data-view="right">右侧窗孔</button><button data-view="left">左侧窗孔</button><button data-view="ridge">天际线与山脊</button><label>窗灯亮度 <output>200%</output> <input id="gain" type="range" min="0" max="2" step=".01" value="2"></label><main><figure><figcaption>原始关灯底图</figcaption><canvas id="off"></canvas></figure><figure><figcaption>隔离窗灯叠加</figcaption><canvas id="on"></canvas></figure></main><script>
const boxes={all:[0,400,2736,850],right:[2460,860,276,290],left:[0,550,430,370],ridge:[0,380,2736,170]};let view='all',ready=false;const base=new Image(),light=new Image();base.src='../../assets/base.png';light.src='../../assets/distant-reset/window-light.png';Promise.all([base.decode(),light.decode()]).then(()=>{ready=true;render()});const dec=v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4},enc=v=>Math.round(255*Math.min(1,v<=.0031308?v*12.92:1.055*v**(1/2.4)-.055));function render(){if(!ready)return;let [x,y,w,h]=boxes[view],a=document.getElementById('off'),b=document.getElementById('on');a.width=b.width=w;a.height=b.height=h;let ac=a.getContext('2d'),bc=b.getContext('2d');ac.drawImage(base,x,y,w,h,0,0,w,h);bc.drawImage(light,x,y,w,h,0,0,w,h);let img=ac.getImageData(0,0,w,h),inc=bc.getImageData(0,0,w,h),gain=+document.getElementById('gain').value;for(let i=0;i<img.data.length;i+=4)for(let c=0;c<3;c++)img.data[i+c]=enc(dec(img.data[i+c])+gain*dec(inc.data[i+c]));bc.putImageData(img,0,0);document.querySelector('output').value=Math.round(gain*100)+'%'}document.getElementById('gain').oninput=render;for(let b of document.querySelectorAll('button'))b.onclick=()=>{view=b.dataset.view;render()};
</script>
