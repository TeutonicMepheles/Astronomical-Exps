<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>镜座与镜片 · 三版切换对照</title><link rel="stylesheet" href="css/tray-transition-preview.css"></head>
<body><main><header><div><p class="eyebrow">牛顿望远镜 · 动效方案</p><h1>镜座与镜片，一起自然换场</h1></div><a href="TRAY_TRANSITIONS.md">查看完整切换规范 ↗</a></header>
<nav aria-label="切换方案"><button type="button" data-variant="a" aria-pressed="false"><strong>A · 原位淡换</strong><span>200ms · 简短、稳定，保持空间位置</span></button><button type="button" data-variant="b" aria-pressed="true"><strong>B · 定向轻滑 <em>已选用</em></strong><span>300ms · 托盘随翻页方向轻移</span></button><button type="button" data-variant="c" aria-pressed="false"><strong>C · 分组错峰</strong><span>380ms · 仪器先就位，光路再出现</span></button></nav>
<section class="scene-shell" aria-label="切换演示"><div id="scene"><div class="heading"><i></i><h2>牛顿望远镜实验</h2><p>MIRROR OPTICS</p></div><div class="notebook" aria-hidden="true">1</div><span class="scene-note">切换方案预览</span><div id="fixed-art" aria-hidden="true"></div><svg id="axis" viewBox="0 0 1600 900" aria-hidden="true"></svg><div id="pages" aria-hidden="true"></div><button type="button" id="page-arrow" aria-label="向右切换到透镜"><img src="assets/arrow-options/gold-left.png" alt="" draggable="false"></button></div></section>
<div class="controls"><div class="actions"><button type="button" id="switch-page">切换到透镜 →</button><button type="button" id="replay">重播向右切换</button></div><div class="options"><label><input type="checkbox" id="slow"> 2 倍慢放</label><label><input type="checkbox" id="reduce"> 减少动态效果</label><span id="status" role="status" aria-live="polite">反射镜 · 就绪</span></div></div>
<p id="description"></p><p class="footnote">点击场景中的金色箭头或上方按钮。此页用于比较三版切换；镜片拖放与课程操作请返回<a href="index.html">实验页面</a>。</p></main><script src="js/tray-transition-fixtures.js"></script><script src="js/tray-transition-preview.js"></script></body></html>
