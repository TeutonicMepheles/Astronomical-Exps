<h1>曲面镜两层拆分：可变镜体 ＋ 固定结构</h1>
<p><strong>可变镜体</strong>合并银色镜面与紧贴镜面的背壳；<strong>固定结构</strong>包含上下长方体端块、所有螺钉、连接架、连接轴、夹具、立柱和底座。</p>
<p>镜面前缘始终遵循所选曲线，银色镜面与蓝色背壳的交界随前缘同步移动，保持银色带的可见宽度。最外背缘、上下端块与支架保持不变，蓝色背壳负责衔接。曲率限制在不会挤穿背壳的范围；这是形状设计预览，尚未接入实验焦距与光路。图层为 AI 提取补全，局部细节与原图存在差异。</p>
<div class="toolbar"><label for="curve-model">镜面模型 <select id="curve-model"><option value="parabola">抛物面 · 截面为抛物线</option><option value="sphere">球面 · 截面为圆弧</option></select></label><label><input id="curve-guide" type="checkbox">显示理论曲线</label></div>
<p id="curve-description"></p>
<p>数值使用预览像素单位，未标定为实际毫米。资料：<a href="https://openstax.org/books/university-physics-volume-3/pages/2-2-spherical-mirrors">OpenStax：球面与抛物面镜</a> · <a href="https://www.edmundoptics.com/knowledge-center/application-notes/optics/all-about-aspheric-lenses/">Edmund Optics：圆锥曲面方程</a>。</p>
