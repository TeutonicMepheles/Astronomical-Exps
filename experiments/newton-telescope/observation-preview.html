<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第三部分 · 独立副本预览</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#050a16}iframe{display:block}</style></head>
<body><iframe src="index.html" title="第三部分参数观测预览"></iframe><script>
// Review entry only: the main experiment retains all three-stage gates.
document.querySelector('iframe').addEventListener('load',function(){
  const N=this.contentWindow.Newton;if(!N?.course)return;
  const c=N.course;for(const mirror of ['plane','concave','convex'])c.mountMirror(mirror);
  c.enter('assembly');c.install('primary','primary');c.install('secondary','secondary');c.enter('observation');
});
</script></body></html>
