<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>凸透镜原图形状控制</title><style>
*{box-sizing:border-box}body{margin:0;background:#13263f;color:#e9f3ff;font:16px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:28px}h1{font-size:27px;margin:0 0 8px}p{color:#b9cce3}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:20px;padding:16px;background:#223e5d;border-radius:12px;margin:20px 0}input[type=range]{width:240px;accent-color:#f4cb83}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid #7292b452;border-radius:12px;overflow:hidden;background:#1c3552}.card h2{font-size:17px;text-align:center;margin:12px 0}.artwork{position:relative;width:330px;height:530px;margin:auto;overflow:hidden;background-color:#40627e;background-image:linear-gradient(#bed5e72b 1px,transparent 1px),linear-gradient(90deg,#bed5e72b 1px,transparent 1px);background-size:18px 18px}.artwork img,.artwork canvas{position:absolute;left:-832px;top:-71.5px;width:1331.2px;height:748.8px;pointer-events:none}.glass-only .artwork img{display:none}.actions{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}button{background:#375574;color:#fff;border:1px solid #91afcb;border-radius:6px;padding:7px 12px;cursor:pointer}a{color:#f4cb83}.note{font-size:13px}@media(max-width:1050px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>凸透镜原图形状控制</h1><p>镜框使用第一张原图；玻璃只取第二张图的可见像素。右侧可连续调节，100% 为原始玻璃形状。</p><div class="toolbar"><label>凸起程度 <input id="shape-control" type="range" min="92" max="100" value="100"></label><output id="shape-value">100%</output><button id="restore-original">恢复原图</button><label><input id="glass-only" type="checkbox"> 单独看玻璃</label></div><div class="grid" id="comparisons"></div><p class="note">玻璃右侧边界与上下端点固定；只在原可见范围内压缩凸起，保留原有颜色、反光和透明度。形状比例为示意参数。</p><div class="actions"><a href="assets/table-lenses/convex-original/holder.png">固定镜框原图</a><a href="assets/table-lenses/convex-original/glass.png">提取的玻璃图层</a><a href="index.html">返回实验</a></div></main><script>window.Newton={};</script><script src="js/convex-original-profile.js"></script><script src="js/convex-original-shape.js"></script><script>
const samples=[];for(const [value,name] of [[92,'较平形态 · 92%'],[100,'原始形态 · 100%'],[null,'交互调节 · 100%']]){const card=document.createElement('section');card.className='card';const title=document.createElement('h2');title.textContent=name;const scene=document.createElement('div');scene.className='artwork';const frame=document.createElement('img');frame.src=Newton.convexShape.holder;frame.alt='固定镜框';const glass=document.createElement('canvas');scene.append(frame,glass);card.append(title,scene);document.querySelector('#comparisons').append(card);samples.push({value,title,glass});}
const slider=document.querySelector('#shape-control'),art=new Newton.ConvexOriginalArt(render);function render(){for(const s of samples){const value=s.value??Number(slider.value);art.render(value,s.glass);if(s.value===null)s.title.textContent='交互调节 · '+value+'%';}document.querySelector('#shape-value').textContent=slider.value+'%';}slider.addEventListener('input',render);document.querySelector('#restore-original').addEventListener('click',()=>{slider.value=100;render();});document.querySelector('#glass-only').addEventListener('change',e=>document.body.classList.toggle('glass-only',e.target.checked));render();
</script></body></html>
