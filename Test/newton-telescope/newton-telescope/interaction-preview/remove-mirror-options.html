<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>取下镜片 · 10款图标</title><style>body{margin:28px;background:#101a30;color:#edf3ff;font:16px system-ui}h1{font-size:26px}p{color:#acbbd1}main{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}button{background:#202e4d;color:inherit;border:1px solid #7693ba66;border-radius:12px;padding:10px;text-align:left;cursor:pointer}button:hover,button:focus-visible{border-color:#f4cb83}button img{width:100%;display:block;border-radius:8px}h2{font-size:16px;margin:12px 0 4px}dialog{background:#101a30;border:1px solid #7693ba;color:white;border-radius:12px;max-width:90vw}dialog img{display:block;max-width:80vw;max-height:75vh}dialog::backdrop{background:#080d27cc}@media(max-width:900px){main{grid-template-columns:repeat(2,1fr)}}</style><h1>取下镜片 · 10 款图标方案</h1><p>暖黄色 · 圆润轮廓 · 磨砂颗粒。点击放大，选择编号后再替换正式按钮。</p><main><button type="button" data-number="1"><img src="../assets/remove-mirror-options/01.png" alt="向上取出"><h2>01 · 向上取出</h2></button><button type="button" data-number="2"><img src="../assets/remove-mirror-options/02.png" alt="侧向取出"><h2>02 · 侧向取出</h2></button><button type="button" data-number="3"><img src="../assets/remove-mirror-options/03.png" alt="托盘归位"><h2>03 · 托盘归位</h2></button><button type="button" data-number="4"><img src="../assets/remove-mirror-options/04.png" alt="轻提镜片"><h2>04 · 轻提镜片</h2></button><button type="button" data-number="5"><img src="../assets/remove-mirror-options/05.png" alt="解除夹持"><h2>05 · 解除夹持</h2></button><button type="button" data-number="6"><img src="../assets/remove-mirror-options/06.png" alt="镜片移出"><h2>06 · 镜片移出</h2></button><button type="button" data-number="7"><img src="../assets/remove-mirror-options/07.png" alt="返回托盘"><h2>07 · 返回托盘</h2></button><button type="button" data-number="8"><img src="../assets/remove-mirror-options/08.png" alt="弹出镜片"><h2>08 · 弹出镜片</h2></button><button type="button" data-number="9"><img src="../assets/remove-mirror-options/09.png" alt="镜片减号"><h2>09 · 镜片减号</h2></button><button type="button" data-number="10"><img src="../assets/remove-mirror-options/10.png" alt="托举移走"><h2>10 · 托举移走</h2></button></main><dialog><img alt=""><p></p><button type="button">关闭</button></dialog><script>const dialog=document.querySelector('dialog');document.querySelectorAll('main button').forEach(b=>b.onclick=()=>{dialog.querySelector('img').src=b.querySelector('img').src;dialog.querySelector('img').alt=b.querySelector('img').alt;dialog.querySelector('p').textContent=b.querySelector('h2').textContent;dialog.showModal()});dialog.querySelector('button').onclick=()=>dialog.close();</script></html>
