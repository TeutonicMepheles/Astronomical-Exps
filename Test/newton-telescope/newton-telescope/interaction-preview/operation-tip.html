<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>顶部操作提示预览</title><link rel="stylesheet" href="../shared/operation-tip.css"><style>body{margin:0;background:#101a30;color:#e5edf9;font:16px system-ui}main{position:relative;height:85vh;background:#202e4d}nav{padding:24px;display:flex;gap:16px}button{padding:10px 20px;background:#7693ba;color:#101a30;border:0;border-radius:8px;cursor:pointer}p{position:absolute;top:45%;width:100%;text-align:center}</style><main id="stage"><p>操作提示固定于容器顶部中央，不跟随鼠标移动。</p></main><nav><button id="show">展开提示</button><button id="hide">收起提示</button><a href="../shared/README.md">组件清单</a></nav><script src="../shared/operation-tip.js"></script><script>const tip=new ExperimentUI.OperationTip(document.querySelector('#stage'));document.querySelector('#show').onclick=()=>tip.show('放下以安装镜片');document.querySelector('#hide').onclick=()=>tip.hide();tip.show('放下以安装镜片');</script></html>
